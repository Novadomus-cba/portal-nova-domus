<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Domus — Flujo de Caja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg:#0d0f12;--surface:#151821;--surface2:#1c1f2b;
  --border:#232733;--text:#e8eaf0;--muted:#6b7280;
  --accent:#c8a96e;--accent-dim:#7a6340;
  --ok:#4ade80;--warn:#f59e0b;--danger:#e05c5c;
  --info:#60a5fa;
  font-family:'Inter',system-ui,sans-serif;font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:rgba(13,15,18,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:0 16px;height:50px;display:flex;align-items:center;gap:8px;flex-shrink:0;position:sticky;top:0;z-index:50}
.back-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
.back-link:hover{color:var(--text)}
.back-icon{width:22px;height:22px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px}
.topbar-sep{width:1px;height:16px;background:var(--border)}
.topbar-title{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.user-name{font-size:11px;color:var(--muted)}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.logout-btn:hover{color:var(--text);border-color:var(--muted)}
.page{flex:1;overflow-y:auto;padding:16px}
.container{max-width:880px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.btn:hover{color:var(--text);border-color:var(--muted)}
.btn.active{background:var(--accent);color:#0d0f12;border-color:var(--accent)}
.btn-nav{padding:5px 12px}
.badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.alert-bar{background:#2e0d0d;border:1px solid #4a1515;border-radius:8px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px}
.alert-icon{font-size:16px;flex-shrink:0}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:12px;font-weight:700;color:var(--danger);margin-bottom:4px}
.alert-items{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.period-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.period-label{font-size:15px;font-weight:800;flex:1;text-align:center;min-width:140px}
.mode-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.mode-btn{padding:6px 12px;font-size:11px;font-weight:700;border:none;background:var(--surface2);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s}
.mode-btn.active{background:var(--accent);color:#0d0f12}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:640px){.detail-grid{grid-template-columns:1fr}}
.detail-col{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.detail-col-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.detail-row:last-child{border-bottom:none}
.detail-row.total{font-weight:800;font-size:13px;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.detail-sub{padding-left:12px;font-size:11px;color:var(--muted)}
.toggle-sub{background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;font-family:inherit;padding:0;margin-left:4px}
.toggle-sub:hover{color:var(--text)}
.neto-card{border-radius:10px;padding:16px;margin-bottom:14px;text-align:center}
.neto-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.neto-monto{font-size:28px;font-weight:900;letter-spacing:-1px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.kpi-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.kpi-val{font-size:18px;font-weight:900}
#app-loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;font-size:13px;color:var(--muted);flex-direction:column;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:18px;right:18px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px;transform:translateY(60px);opacity:0;transition:all .2s;z-index:9999;max-width:300px}
#toast.show{transform:translateY(0);opacity:1}
#toast.err{border-color:var(--danger);color:var(--danger)}
.loading-overlay{display:none;position:absolute;inset:0;background:rgba(13,15,18,.6);border-radius:10px;align-items:center;justify-content:center;z-index:10}
.loading-overlay.show{display:flex}
@media(min-width:640px){.topbar{padding:0 24px}.page{padding:20px}}
</style>
</head>
<body>
<div id="app-loading"><div class="spin"></div>Cargando datos…</div>

<div class="topbar">
  <a href="index.html" class="back-link"><span class="back-icon">⌂</span>Portal</a>
  <div class="topbar-sep"></div>
  <span class="topbar-title">Flujo de Caja</span>
  <div class="topbar-right">
    <span class="user-name" id="userName"></span>
    <button class="logout-btn" onclick="handleLogout()">Salir</button>
  </div>
</div>

<div class="page">
<div class="container">

<!-- Alertas -->
<div id="alertas"></div>

<!-- Navegación de período -->
<div class="card" style="padding:12px 16px">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between">
    <div class="mode-toggle">
      <button class="mode-btn" id="modeSemana" onclick="setMode('semanal')">Semanal</button>
      <button class="mode-btn active" id="modeMes" onclick="setMode('mensual')">Mensual</button>
    </div>
    <div class="period-nav" style="margin:0;flex:1;justify-content:center">
      <button class="btn btn-nav" onclick="navigate(-1)">‹ Anterior</button>
      <span class="period-label" id="periodLabel">—</span>
      <button class="btn btn-nav" onclick="navigate(1)" id="btnNext">Siguiente ›</button>
    </div>
  </div>
</div>

<!-- KPIs rápidos -->
<div class="kpi-row" id="kpiRow">
  <div class="kpi"><div class="kpi-label">Ingresos</div><div class="kpi-val" id="kpiIngresos" style="color:var(--ok)">—</div></div>
  <div class="kpi"><div class="kpi-label">Egresos</div><div class="kpi-val" id="kpiEgresos" style="color:var(--danger)">—</div></div>
  <div class="kpi"><div class="kpi-label">Resultado neto</div><div class="kpi-val" id="kpiNeto">—</div></div>
  <div class="kpi"><div class="kpi-label">Cheques pendientes</div><div class="kpi-val" id="kpiCheques" style="color:var(--info)">—</div></div>
</div>

<!-- Gráfico -->
<div class="chart-wrap" style="position:relative">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px" id="chartTitle">Evolución</span>
    <div style="display:flex;gap:12px;font-size:10px;color:var(--muted)">
      <span>■ <span style="color:var(--ok)">Ingresos</span></span>
      <span>■ <span style="color:var(--danger)">Egresos</span></span>
    </div>
  </div>
  <canvas id="flowChart" height="180"></canvas>
  <div class="loading-overlay" id="chartLoading"><div class="spin"></div></div>
</div>

<!-- Detalle del período -->
<div class="detail-grid">
  <div class="detail-col">
    <div class="detail-col-title" style="color:var(--ok)">↑ Ingresos</div>
    <div id="ingresosDetail"><div style="color:var(--muted);font-size:12px;padding:8px 0">Cargando…</div></div>
  </div>
  <div class="detail-col">
    <div class="detail-col-title" style="color:var(--danger)">↓ Egresos</div>
    <div id="egresosDetail"><div style="color:var(--muted);font-size:12px;padding:8px 0">Cargando…</div></div>
  </div>
</div>

</div><!-- /container -->
</div><!-- /page -->
<div id="toast"></div>
<script>
// ── CONFIG ─────────────────────────────────────────────────────
const SB_URL   = 'https://voowjwzlkhdknpapkhxc.supabase.co';
const SB_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvb3dqd3psa2hka25wYXBraHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMjM1NDIsImV4cCI6MjA5NzY5OTU0Mn0.RnnDcxrQbjM4n3RbLQiT0LZj-tgoID5friXsoyY8GsM';
const AUTH_URL = 'https://vvwnyszcfindtuvojqgs.supabase.co';
const AUTH_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d255c3pjZmluZHR1dm9qcWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NzQ0OTYsImV4cCI6MjA5NzA1MDQ5Nn0.m88xRQjifgPayIBY8Y98fP4jQ1AzyrBJidZDyTamWxE';

const { createClient } = supabase;
const authClient = createClient(AUTH_URL, AUTH_KEY);

// ── FETCH ─────────────────────────────────────────────────────
async function apiFetch(baseUrl, apiKey, method, table, body=null, query='') {
  const res = await fetch(`${baseUrl}/rest/v1/${table}${query}`, {
    method,
    headers: { 'apikey':apiKey, 'Authorization':`Bearer ${apiKey}`, 'Content-Type':'application/json', 'Prefer': '' },
    ...(body?{body:JSON.stringify(body)}:{})
  });
  if (!res.ok) { const t=await res.text(); let m=res.statusText; try{m=JSON.parse(t).message||m;}catch{} throw new Error(m); }
  if (res.status===204) return null;
  const t=await res.text(); return t?JSON.parse(t):null;
}
const sbGet   = (t,q='') => apiFetch(SB_URL,SB_KEY,'GET',t,null,q);
const authGet = (t,q='') => apiFetch(AUTH_URL,AUTH_KEY,'GET',t,null,q);

// ── FORMAT ─────────────────────────────────────────────────────
const f$s = n => '$ '+(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
const fd  = iso => { if(!iso)return'—'; const[y,m,d]=iso.split('-'); return`${d}/${m}/${y}`; };

// ── PERIOD HELPERS ─────────────────────────────────────────────
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_S = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function getMonthPeriod(year, month) {
  const d1 = `${year}-${String(month).padStart(2,'0')}-01`;
  const last = new Date(year, month, 0).getDate();
  const d2 = `${year}-${String(month).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
  return { desde:d1, hasta:d2, label:`${MESES[month-1]} ${year}`, short:`${MESES_S[month-1]} ${year}` };
}

function getWeekPeriod(refDate) {
  const d = new Date(refDate+'T12:00:00');
  const dow = d.getDay();
  const diff = dow===0?-6:1-dow;
  const mon = new Date(d); mon.setDate(d.getDate()+diff);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const iso = dt => dt.toISOString().slice(0,10);
  const fmt = dt => `${dt.getDate()}/${dt.getMonth()+1}`;
  return { desde:iso(mon), hasta:iso(sun), label:`${fmt(mon)} – ${fmt(sun)}/${sun.getMonth()+1}`, short:`${fmt(mon)}-${fmt(sun)}` };
}

function addMonths(y,m,delta) {
  let nm=m+delta, ny=y;
  while(nm>12){nm-=12;ny++;} while(nm<1){nm+=12;ny--;}
  return{y:ny,m:nm};
}

function addDays(iso, days) {
  const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10);
}

// ── STATE ──────────────────────────────────────────────────────
let mode='mensual'; // 'mensual' | 'semanal'
let curYear=new Date().getFullYear(), curMonth=new Date().getMonth()+1;
let curWeekRef=new Date().toISOString().slice(0,10);
let chartInstance=null;
let showEgrDetalle=false;

function getCurrentPeriod() {
  return mode==='mensual' ? getMonthPeriod(curYear,curMonth) : getWeekPeriod(curWeekRef);
}

function getChartPeriods() {
  const N = mode==='mensual'?6:8;
  const periods=[];
  if(mode==='mensual'){
    let {y,m}={y:curYear,m:curMonth};
    for(let i=N-1;i>=0;i--){
      const r=addMonths(y,m,-i); periods.push(getMonthPeriod(r.y,r.m));
    }
  } else {
    let ref=curWeekRef;
    for(let i=N-1;i>=0;i--){
      const r=addDays(ref,-(i*7)); periods.push(getWeekPeriod(r));
    }
  }
  return periods;
}

// ── AUTH ──────────────────────────────────────────────────────
async function handleLogout() { await authClient.auth.signOut(); window.location.href='login.html'; }

// ── NAV ───────────────────────────────────────────────────────
function setMode(m) {
  mode=m;
  document.getElementById('modeSemana').classList.toggle('active',m==='semanal');
  document.getElementById('modeMes').classList.toggle('active',m==='mensual');
  loadAll();
}

function navigate(delta) {
  if(mode==='mensual'){
    const r=addMonths(curYear,curMonth,delta);
    curYear=r.y; curMonth=r.m;
  } else {
    curWeekRef=addDays(getWeekPeriod(curWeekRef).desde,delta*7);
  }
  const todayIso=new Date().toISOString().slice(0,10);
  const cur=getCurrentPeriod();
  document.getElementById('btnNext').disabled=cur.desde>todayIso;
  loadAll();
}

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className=`show ${type}`;setTimeout(()=>t.className='',3500);}

// ── DATA AGGREGATION ──────────────────────────────────────────
function sumField(arr, field) { return (arr||[]).reduce((s,r)=>s+(parseFloat(r[field])||0),0); }
function egresoDate(e) { return e.fecha_pago||e.fecha_vencimiento||e.fecha_emision; }

function inPeriod(dateStr, desde, hasta) {
  return dateStr && dateStr >= desde && dateStr <= hasta;
}

function calcIngresos(raw, desde, hasta) {
  const certs = (raw.recibos||[]).filter(r=>inPeriod(r.fecha_emision,desde,hasta))
    .flatMap(r=>(r.recibos_lineas||[]).filter(l=>l.tipo==='CERTIFICADO'||l.tipo==='EXCEDENTE'))
    .reduce((s,l)=>s+(l.monto_pesos||0),0);
  const ventas = (raw.ventas||[]).filter(v=>inPeriod(v.fecha_pago,desde,hasta)).reduce((s,v)=>s+(parseFloat(v.total_ars)||0),0);
  const cheqRec = (raw.cheques||[]).filter(c=>c.tipo==='RECIBIDO'&&inPeriod(c.fecha_efectivo,desde,hasta)).reduce((s,c)=>s+(parseFloat(c.monto)||0),0);
  return { certs, ventas, cheqRec, total: certs+ventas+cheqRec };
}

function calcEgresos(raw, desde, hasta) {
  const cuadrilla = (raw.jornadas||[]).filter(j=>inPeriod(j.fecha,desde,hasta))
    .reduce((s,j)=>s+(j.jornal||0)+(j.almuerzo||0)+(j.traslados||0)+(j.peaje||0)+(j.otros||0)+(j.compras||0),0);
  const compras = (raw.facturas||[]).filter(f=>inPeriod(f.fecha_compra,desde,hasta)).reduce((s,f)=>s+(parseFloat(f.monto_con_iva)||0),0);
  const egByCat = {};
  (raw.egresos||[]).filter(e=>inPeriod(egresoDate(e),desde,hasta)).forEach(e=>{
    egByCat[e.categoria]=(egByCat[e.categoria]||0)+(parseFloat(e.monto_total)||0);
  });
  const egTotal = Object.values(egByCat).reduce((s,v)=>s+v,0);
  const cuotas = (raw.cuotas||[]).filter(c=>inPeriod(c.fecha_vencimiento,desde,hasta)).reduce((s,c)=>s+(parseFloat(c.monto)||0),0);
  const cheqEm = (raw.cheques||[]).filter(c=>c.tipo==='EMITIDO'&&inPeriod(c.fecha_efectivo,desde,hasta)).reduce((s,c)=>s+(parseFloat(c.monto)||0),0);
  return { cuadrilla, compras, egresos:egTotal, egByCat, cuotas, cheqEm, total:cuadrilla+compras+egTotal+cuotas+cheqEm };
}

// ── MAIN LOAD ─────────────────────────────────────────────────
let rawData = null;

async function loadAll() {
  const periods = getChartPeriods();
  const desde = periods[0].desde;
  const hasta  = periods[periods.length-1].hasta;
  document.getElementById('periodLabel').textContent = getCurrentPeriod().label;
  document.getElementById('chartTitle').textContent = `Evolución — últimos ${periods.length} ${mode==='mensual'?'meses':'semanas'}`;
  document.getElementById('chartLoading').classList.add('show');
  document.getElementById('ingresosDetail').innerHTML='<div style="color:var(--muted);font-size:12px;padding:8px 0">Cargando…</div>';
  document.getElementById('egresosDetail').innerHTML='<div style="color:var(--muted);font-size:12px;padding:8px 0">Cargando…</div>';

  try {
    const [recibos, ventas, cheques, jornadas, facturas, egresos, cuotas] = await Promise.all([
      sbGet('recibos',`?estado=eq.PAGADO&fecha_emision=gte.${desde}&fecha_emision=lte.${hasta}&select=fecha_emision,recibos_lineas(tipo,monto_pesos)`),
      authGet('ventas_comerciales',`?fecha_pago=gte.${desde}&fecha_pago=lte.${hasta}&select=fecha_pago,total_ars`),
      sbGet('cheques_vista',`?fecha_efectivo=gte.${desde}&fecha_efectivo=lte.${hasta}&select=tipo,fecha_efectivo,monto,estado_calculado`),
      sbGet('cuadrilla_jornadas',`?fecha=gte.${desde}&fecha=lte.${hasta}&select=fecha,jornal,almuerzo,traslados,peaje,otros,compras`),
      sbGet('facturas_obra',`?origen_pago=eq.empresa&fecha_compra=gte.${desde}&fecha_compra=lte.${hasta}&select=fecha_compra,monto_con_iva`),
      sbGet('egresos_generales',`?fecha_emision=gte.${desde}&fecha_emision=lte.${hasta}&select=categoria,monto_total,fecha_emision,fecha_vencimiento,fecha_pago`),
      sbGet('planes_pago_cuotas_vista',`?fecha_vencimiento=gte.${desde}&fecha_vencimiento=lte.${hasta}&select=fecha_vencimiento,monto,estado_calculado`),
    ]);
    rawData = { recibos:recibos||[], ventas:ventas||[], cheques:cheques||[], jornadas:jornadas||[], facturas:facturas||[], egresos:egresos||[], cuotas:cuotas||[] };
    renderChart(periods);
    renderDetail(getCurrentPeriod());
    renderKpis(desde, hasta);
  } catch(e) {
    toast('Error cargando datos: '+e.message,'err');
  } finally {
    document.getElementById('chartLoading').classList.remove('show');
  }
}

async function loadAlertas() {
  try {
    const [vencidas, cheqVenc] = await Promise.all([
      sbGet('planes_pago_cuotas_vista','?estado_calculado=eq.VENCIDO&select=numero_cuota,fecha_vencimiento,monto,concepto,organismo_proveedor&limit=20'),
      sbGet('cheques_vista','?estado_calculado=eq.VENCIDO_SIN_COBRAR&select=tipo,beneficiario_librador,monto,fecha_efectivo&limit=20'),
    ]);
    const el=document.getElementById('alertas');
    let html='';
    if(vencidas&&vencidas.length){
      html+=`<div class="alert-bar">
        <span class="alert-icon">⚠</span>
        <div class="alert-body">
          <div class="alert-title">${vencidas.length} cuota${vencidas.length>1?'s':''} de planes de pago vencida${vencidas.length>1?'s':''} sin pagar</div>
          <div class="alert-items">${vencidas.slice(0,5).map(c=>`<span>${c.concepto} C${c.numero_cuota} · ${fd(c.fecha_vencimiento)} · $${(c.monto||0).toLocaleString('es-AR',{maximumFractionDigits:0})}</span>`).join('')}${vencidas.length>5?`<span>+${vencidas.length-5} más…</span>`:''}</div>
        </div>
      </div>`;
    }
    if(cheqVenc&&cheqVenc.length){
      html+=`<div class="alert-bar">
        <span class="alert-icon">🗓</span>
        <div class="alert-body">
          <div class="alert-title">${cheqVenc.length} cheque${cheqVenc.length>1?'s':''} vencido${cheqVenc.length>1?'s':''} sin cobrar</div>
          <div class="alert-items">${cheqVenc.slice(0,5).map(c=>`<span>${c.tipo} · ${c.beneficiario_librador} · ${fd(c.fecha_efectivo)} · $${(c.monto||0).toLocaleString('es-AR',{maximumFractionDigits:0})}</span>`).join('')}${cheqVenc.length>5?`<span>+${cheqVenc.length-5} más…</span>`:''}</div>
        </div>
      </div>`;
    }
    el.innerHTML=html;
  } catch{}
}

// ── CHART ─────────────────────────────────────────────────────
function renderChart(periods) {
  const labels=periods.map(p=>p.short);
  const ingData=periods.map(p=>calcIngresos(rawData,p.desde,p.hasta).total);
  const egData =periods.map(p=>calcEgresos(rawData,p.desde,p.hasta).total);

  const ctx=document.getElementById('flowChart').getContext('2d');
  if(chartInstance)chartInstance.destroy();
  chartInstance=new Chart(ctx,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Ingresos',data:ingData,backgroundColor:'rgba(74,222,128,0.5)',borderColor:'rgba(74,222,128,1)',borderWidth:1,borderRadius:3},
        {label:'Egresos', data:egData, backgroundColor:'rgba(224,92,92,0.5)', borderColor:'rgba(224,92,92,1)', borderWidth:1,borderRadius:3},
      ]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#6b7280',font:{size:10}},grid:{color:'#1c1f2b'}},
        y:{ticks:{color:'#6b7280',font:{size:10},callback:v=>'$'+v.toLocaleString('es-AR',{maximumFractionDigits:0})},grid:{color:'#1c1f2b'}},
      },
      responsive:true,
      interaction:{mode:'index',intersect:false},
    }
  });
}

// ── DETAIL ─────────────────────────────────────────────────────
const CATG={
  'Impuestos':['IMPUESTO_IVA','IMPUESTO_IIBB','IMPUESTO_GANANCIAS','IMPUESTO_MONOTRIBUTO_AUTONOMOS','IMPUESTO_TASAS_MUNICIPALES','IMPUESTO_CHEQUE','IMPUESTO_OTROS'],
  'Sueldos':['SUELDOS','CARGAS_SOCIALES','ART','SINDICATO','AGUINALDO','INDEMNIZACIONES'],
  'Servicios':['ALQUILER','SERVICIO_LUZ','SERVICIO_GAS','SERVICIO_AGUA','SERVICIO_INTERNET_TELEFONIA','EXPENSAS'],
  'Honorarios':['HONORARIOS_CONTADOR','HONORARIOS_ABOGADO','HONORARIOS_OTROS'],
  'Seguros':['SEGURO_RC','SEGURO_VEHICULOS','SEGURO_OTROS'],
  'Bancarios':['GASTO_BANCARIO_COMISION','GASTO_BANCARIO_INTERES'],
  'Movilidad':['COMBUSTIBLE','PEAJES_ESTACIONAMIENTO','MANTENIMIENTO_VEHICULOS'],
  'Otros':['OTROS_GASTOS_OPERATIVOS'],
};

function dr(label, monto, opts={}) {
  const cls=opts.total?'detail-row total':opts.sub?'detail-row detail-sub':'detail-row';
  const color=opts.colorOk?'color:var(--ok)':opts.colorDanger?'color:var(--danger)':opts.colorAccent?'color:var(--accent)':'';
  return `<div class="${cls}"><span>${label}${opts.toggle?`<button class="toggle-sub" onclick="toggleEgrDetalle()">${showEgrDetalle?'▲':'▼'}</button>`:''}</span><span style="${color};font-weight:${opts.total?'800':'400'}">${f$s(monto)}</span></div>`;
}

function renderDetail(period) {
  if(!rawData) return;
  const {desde,hasta}=period;
  const ing=calcIngresos(rawData,desde,hasta);
  const eg =calcEgresos(rawData,desde,hasta);

  // Ingresos
  let iHtml='';
  iHtml+=dr('Certificados / Excedentes',ing.certs,{colorOk:true});
  iHtml+=dr('Ventas comerciales',ing.ventas,{colorOk:true});
  iHtml+=dr('Cheques recibidos',ing.cheqRec,{colorOk:true});
  iHtml+=dr('Total ingresos',ing.total,{total:true,colorOk:true});
  document.getElementById('ingresosDetail').innerHTML=iHtml;

  // Egresos — group egByCat
  const groupTotals={};
  Object.entries(CATG).forEach(([g,keys])=>{
    groupTotals[g]=keys.reduce((s,k)=>s+(eg.egByCat[k]||0),0);
  });
  const egGenTotal=Object.values(groupTotals).reduce((s,v)=>s+v,0);

  let eHtml='';
  eHtml+=dr('Cuadrilla (MO + compras)',eg.cuadrilla,{colorDanger:true});
  eHtml+=dr('Compras a proveedores',eg.compras,{colorDanger:true});
  eHtml+=dr(`Egresos generales ${egGenTotal>0?'':'(sin datos)'}`,egGenTotal,{colorDanger:true,toggle:egGenTotal>0});
  if(showEgrDetalle && egGenTotal>0){
    Object.entries(groupTotals).filter(([,v])=>v>0).forEach(([g,v])=>{
      eHtml+=dr(g,v,{sub:true});
    });
  }
  eHtml+=dr('Cuotas planes de pago',eg.cuotas,{colorDanger:true});
  eHtml+=dr('Cheques emitidos',eg.cheqEm,{colorDanger:true});
  eHtml+=dr('Total egresos',eg.total,{total:true,colorDanger:true});

  // Neto
  const neto=ing.total-eg.total;
  const netoColor=neto>=0?'color:var(--ok)':'color:var(--danger)';
  eHtml+=`<div style="margin-top:14px;padding:12px;border-radius:8px;background:${neto>=0?'#052e16':'#2e0d0d'};border:1px solid ${neto>=0?'#166534':'#4a1515'};display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;${netoColor}">Resultado neto</span>
    <span style="font-size:18px;font-weight:900;${netoColor}">${f$s(neto)}</span>
  </div>`;

  document.getElementById('egresosDetail').innerHTML=eHtml;
}

function toggleEgrDetalle() { showEgrDetalle=!showEgrDetalle; renderDetail(getCurrentPeriod()); }

// ── KPIs ─────────────────────────────────────────────────────
function renderKpis(desde, hasta) {
  const ing=calcIngresos(rawData,desde,hasta);
  const eg =calcEgresos(rawData,desde,hasta);
  const neto=ing.total-eg.total;
  const cheqPend=(rawData.cheques||[]).filter(c=>c.estado_calculado==='PENDIENTE'||c.estado_calculado==='VENCIDO_SIN_COBRAR').length;
  document.getElementById('kpiIngresos').textContent=f$s(ing.total);
  document.getElementById('kpiEgresos').textContent=f$s(eg.total);
  document.getElementById('kpiNeto').style.color=neto>=0?'var(--ok)':'var(--danger)';
  document.getElementById('kpiNeto').textContent=f$s(neto);
  document.getElementById('kpiCheques').textContent=cheqPend+' cheques';
}

// ── INIT ─────────────────────────────────────────────────────
window.onload = async () => {
  const {data:{session}} = await authClient.auth.getSession();
  if (!session) { window.location.href='login.html'; return; }
  const {data:profile} = await authClient.from('user_profiles').select('full_name,role').eq('id',session.user.id).single();
  if (!profile || profile.role!=='admin') { window.location.href='index.html'; return; }
  document.getElementById('userName').textContent=profile.full_name;

  await Promise.all([loadAlertas(), loadAll()]);
  document.getElementById('app-loading').style.display='none';
};
</script>
