name: Proposal check

# Runs on every pull request to main. No path filter on purpose: this is a
# required status check, and a filtered-out required check never reports and
# blocks the merge. When the PR touches no proposal it passes in seconds.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proposal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tracking and internal data
        run: |
          fail=0
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'propuestas/*.html')
          for f in $changed; do
            grep -q 'PY-2026-[0-9]' "$f" || continue
            echo "Checking $f"
            grep -q 'name="py-codigo"' "$f" || { echo "::error file=$f::Missing <meta name=\"py-codigo\">"; fail=1; }
            grep -q 'propuesta_vistas' "$f" || { echo "::error file=$f::Missing propuesta_vistas tracking"; fail=1; }
            # Nothing internal in a client document
            for term in 'ingenier' 'remarque' 'margen_' 'Keeper' 'costo_ars' 'tarifa_mo'; do
              if grep -qi "$term" "$f"; then
                echo "::error file=$f::'$term' appears in a client document"; fail=1
              fi
            done
          done
          # This repo is public: no internal material in the lines the PR adds.
          # .github/ and CLAUDE.md name these terms on purpose (this check, the rules).
          if git diff "$base"...HEAD -- . ':(exclude).github' ':(exclude)CLAUDE.md' \
              | grep -E '^\+' | grep -qE 'voowjwzlkhdknpapkhxc|resumen-interno|escrituras\.sql'; then
            echo "::error::The PR contains internal material; it belongs in nova-domus-py"; fail=1
          fi
          exit $fail
