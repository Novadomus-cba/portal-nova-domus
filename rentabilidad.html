<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Domus — Rentabilidad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1f2436;--border:#2a3049;
  --accent:#e8a020;--text:#e2e6f0;--text2:#8892aa;--text3:#4a5470;
  --ok:#2ecc71;--warn:#f39c12;--danger:#e74c3c;--r:10px;
  font-family:'Inter',system-ui,sans-serif;font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ──────────────────────────────────────────────────── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;height:50px;flex-shrink:0;
  position:sticky;top:0;z-index:100}
.portal-back-link{display:flex;align-items:center;gap:7px;text-decoration:none;
  color:var(--text2);font-size:12px;font-weight:700;transition:color .15s;flex-shrink:0;white-space:nowrap}
.portal-back-link:hover{color:var(--text)}
.portal-back-icon-sm{width:22px;height:22px;background:linear-gradient(135deg,#7a6340,#c8a96e);
  border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px}
.topbar-sep{width:1px;height:16px;background:var(--border);margin:0 8px;flex-shrink:0}
.topbar-module-name{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#portal-username{font-size:11px;color:var(--text2)}
.portal-logout-btn{background:none;border:1px solid var(--border);color:var(--text2);
  padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.portal-logout-btn:hover{color:var(--text);border-color:var(--text2)}

/* ── LOADING ─────────────────────────────────────────────────── */
#app-loading{position:fixed;inset:0;background:#0d0f12;display:flex;
  align-items:center;justify-content:center;z-index:999;font-size:13px;color:#6b7280}

/* ── MAIN ────────────────────────────────────────────────────── */
main{flex:1;max-width:900px;margin:0 auto;width:100%;padding:20px 16px 60px}
.page-title{font-size:20px;font-weight:800;margin-bottom:4px}
.page-sub{font-size:11px;color:var(--text2);margin-bottom:20px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-t{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.reload-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;
  line-height:1;padding:2px 4px;transition:color .15s}
.reload-btn:hover{color:var(--accent)}

/* ── OBRA CARD ───────────────────────────────────────────────── */
.obra-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden}
.obra-card.s-verde       {border-left:4px solid #27ae60}
.obra-card.s-amarillo    {border-left:4px solid #f39c12}
.obra-card.s-rojo        {border-left:4px solid #e74c3c}
.obra-card.s-incoherencias{border-left:4px solid #e67e22}
.obra-card.s-sin_datos   {border-left:4px solid var(--text3)}

.card-top{display:flex;align-items:center;gap:14px;padding:14px 16px 10px}

/* Semáforo circle — elemento más prominente */
.sem-circle{width:56px;height:56px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.sc-verde   {background:#27ae60;box-shadow:0 0 18px rgba(39,174,96,.4)}
.sc-amarillo{background:#f39c12;box-shadow:0 0 18px rgba(243,156,18,.4)}
.sc-rojo    {background:#e74c3c;box-shadow:0 0 18px rgba(231,76,60,.4)}
.sc-incoherencias{background:#e67e22;box-shadow:0 0 18px rgba(230,126,34,.4)}
.sc-sin_datos{background:var(--bg3);border:2px solid var(--border);color:var(--text3);font-size:18px}

.card-info{flex:1;min-width:0}
.obra-nombre{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obra-cliente{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem-tag{margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sem-label-text{font-size:10px;font-weight:800;letter-spacing:.5px}
.cayendo-tag{font-size:10px;color:#f39c12;font-weight:700}

.card-stats{display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--bg3);border-top:1px solid var(--border);padding:10px 16px;gap:0}
.stat{padding:2px 6px 2px 0}
.stat-l{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:4px;white-space:nowrap}
.stat-v{font-size:13px;font-weight:800;line-height:1.3}
.cv{color:var(--ok)} .ca{color:var(--warn)} .cr{color:var(--danger)} .cm{color:var(--text2)}

.card-foot{padding:5px 16px;border-top:1px solid var(--border)}
.card-fecha{font-size:10px;color:var(--text3);text-align:right}

/* ── RESUMEN MES ─────────────────────────────────────────────── */
.resumen{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-top:24px}
.res-title{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:14px}
.res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.res-item{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 14px}
.res-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:5px}
.res-val{font-size:18px;font-weight:900;color:var(--text)}
.sem-counts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding-top:12px;border-top:1px solid var(--border)}
.sem-count-pill{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.sc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── EMPTY / SPINNER ─────────────────────────────────────────── */
.empty{text-align:center;padding:48px 20px;color:var(--text3);font-size:13px}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:sp .6s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media(max-width:520px){
  .card-stats{grid-template-columns:repeat(2,1fr);row-gap:8px}
  .res-grid{grid-template-columns:1fr}
  .sem-counts{gap:12px}
}
</style>
</head>
<body>

<div id="app-loading">Verificando acceso…</div>

<div class="topbar">
  <a href="index.html" class="portal-back-link">
    <span class="portal-back-icon-sm">⌂</span>
    Portal
  </a>
  <div class="topbar-sep"></div>
  <span class="topbar-module-name">Rentabilidad</span>
  <div class="topbar-right">
    <span id="portal-username"></span>
    <button class="portal-logout-btn" onclick="handleLogout()">Salir</button>
  </div>
</div>

<main id="mainContent" style="display:none">
  <div class="page-title">Rentabilidad de Obras</div>
  <div class="page-sub" id="pageSub">Cargando…</div>

  <div class="sh">
    <div class="sh-t">Obras activas</div>
    <button class="reload-btn" onclick="loadAll()" title="Actualizar">↻</button>
  </div>

  <div id="cardsContainer">
    <div class="empty"><div class="spin"></div></div>
  </div>

  <div id="resumenSection" style="display:none">
    <div class="resumen">
      <div class="res-title" id="resTitle">Resumen del mes</div>
      <div class="res-grid">
        <div class="res-item">
          <div class="res-label">Certificado del mes</div>
          <div class="res-val" id="resCert">—</div>
        </div>
        <div class="res-item">
          <div class="res-label">Excedentes del mes</div>
          <div class="res-val" id="resExc">—</div>
        </div>
      </div>
      <div class="sem-counts" id="semCounts"></div>
    </div>
  </div>
</main>

<script>
// ── AUTH ──────────────────────────────────────────────────────────
const AUTH_URL = 'https://vvwnyszcfindtuvojqgs.supabase.co';
const AUTH_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d255c3pjZmluZHR1dm9qcWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NzQ0OTYsImV4cCI6MjA5NzA1MDQ5Nn0.m88xRQjifgPayIBY8Y98fP4jQ1AzyrBJidZDyTamWxE';
const ALLOWED_ROLES = ['admin', 'supervisor'];
const { createClient } = supabase;
const authClient = createClient(AUTH_URL, AUTH_KEY);

async function handleLogout() {
  await authClient.auth.signOut();
  window.location.href = 'login.html';
}

// ── SUPABASE OBRAS ────────────────────────────────────────────────
const SB_URL = 'https://voowjwzlkhdknpapkhxc.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvb3dqd3psa2hka25wYXBraHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMjM1NDIsImV4cCI6MjA5NzY5OTU0Mn0.RnnDcxrQbjM4n3RbLQiT0LZj-tgoID5friXsoyY8GsM';

async function sbGet(table, query = '') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}${query}`, {
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
  });
  const text = await r.text();
  return JSON.parse(text);
}

// ── UTILS ─────────────────────────────────────────────────────────
const fPesos = n => {
  if (n == null) return '—';
  const abs = Math.abs(Math.round(n)).toLocaleString('es-AR');
  return (n < 0 ? '−' : '') + '$ ' + abs;
};
const fDesvio = n => {
  if (n == null) return '—';
  const abs = Math.abs(Math.round(n)).toLocaleString('es-AR');
  return (n > 0 ? '+' : n < 0 ? '−' : '') + '$ ' + abs;
};
const fd = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

const SEM_COLOR = {
  VERDE:'#27ae60', AMARILLO:'#f39c12', ROJO:'#e74c3c',
  SIN_DATOS:'#4a5470', INCOHERENCIAS:'#e67e22'
};
const SEM_LABEL = {
  VERDE:'VERDE', AMARILLO:'AMARILLO', ROJO:'ROJO',
  SIN_DATOS:'Sin datos', INCOHERENCIAS:'Revisar datos'
};
const SEM_ORDER = { ROJO:1, AMARILLO:2, VERDE:3, INCOHERENCIAS:4, SIN_DATOS:5 };

const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function margenCol(v) {
  if (v == null) return 'cm';
  return v >= 25 ? 'cv' : v >= 20 ? 'ca' : 'cr';
}

function monthRange() {
  const now = new Date();
  const y = now.getFullYear(), mn = now.getMonth();
  const mm = String(mn + 1).padStart(2, '0');
  const lastDay = new Date(y, mn + 1, 0).getDate();
  return {
    from:  `${y}-${mm}-01`,
    to:    `${y}-${mm}-${String(lastDay).padStart(2, '0')}`,
    label: `${MONTHS[mn]} ${y}`
  };
}

// ── FETCH ─────────────────────────────────────────────────────────
async function fetchObras() {
  try {
    return await sbGet('obras',
      '?select=id,nombre,cliente_razon_social,presupuesto_total_pesos' +
      '&estado=eq.EN_CURSO&order=nombre.asc');
  } catch { return []; }
}

async function fetchBalances() {
  try {
    return await sbGet('analisis_obra',
      '?select=obra_id,certificado_acumulado_pesos,excedentes_acumulado_pesos,' +
      'cuadrilla_acumulado_pesos,margen_mo_acumulado_pct,semaforo,semanas_cayendo,fecha' +
      '&tipo=eq.BALANCE&order=fecha.asc');
  } catch { return []; }
}

async function fetchMonthly() {
  try {
    const { from, to } = monthRange();
    const recs = await sbGet('recibos',
      `?select=id&estado=not.in.(NO_VALIDO,RECTIFICADO)` +
      `&fecha_emision=gte.${from}&fecha_emision=lte.${to}`);
    if (!recs || !recs.length) return { cert: 0, exc: 0 };

    const ids = recs.map(r => r.id).join(',');
    const lineas = await sbGet('recibos_lineas',
      `?select=tipo,monto_pesos&recibo_id=in.(${ids})&tipo=in.(CERTIFICADO,EXCEDENTE)`);

    return {
      cert: (lineas || []).filter(l => l.tipo === 'CERTIFICADO')
                          .reduce((s, l) => s + (l.monto_pesos || 0), 0),
      exc:  (lineas || []).filter(l => l.tipo === 'EXCEDENTE')
                          .reduce((s, l) => s + (l.monto_pesos || 0), 0),
    };
  } catch { return { cert: 0, exc: 0 }; }
}

// ── LOAD ALL ──────────────────────────────────────────────────────
async function loadAll() {
  document.getElementById('cardsContainer').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  document.getElementById('resumenSection').style.display = 'none';

  const [obras, balances, monthly] = await Promise.all([fetchObras(), fetchBalances(), fetchMonthly()]);

  // Latest balance per obra (balances are already ordered asc so last wins)
  const balMap = {};
  for (const b of balances) {
    if (!balMap[b.obra_id] || b.fecha > balMap[b.obra_id].fecha) balMap[b.obra_id] = b;
  }

  renderCards(obras, balMap);
  renderResumen(obras, balMap, monthly);

  const { label } = monthRange();
  document.getElementById('pageSub').textContent = `${obras.length} obras activas · ${label}`;
}

// ── RENDER CARDS ──────────────────────────────────────────────────
function renderCards(obras, balMap) {
  if (!obras.length) {
    document.getElementById('cardsContainer').innerHTML =
      '<div class="empty">No hay obras activas.</div>';
    return;
  }

  const sorted = [...obras].sort((a, b) => {
    const sa = balMap[a.id]?.semaforo || 'SIN_DATOS';
    const sb = balMap[b.id]?.semaforo || 'SIN_DATOS';
    return (SEM_ORDER[sa] || 5) - (SEM_ORDER[sb] || 5);
  });

  document.getElementById('cardsContainer').innerHTML = sorted.map(o => {
    const b    = balMap[o.id];
    const sem  = b?.semaforo || 'SIN_DATOS';
    const sKey = sem.toLowerCase();
    const col  = SEM_COLOR[sem] || SEM_COLOR.SIN_DATOS;

    // % avance (certificado / presupuesto, excluye excedentes)
    const ppto = o.presupuesto_total_pesos;
    const cert = b?.certificado_acumulado_pesos ?? null;
    const avance = (ppto && ppto > 0 && cert != null)
      ? ((cert / ppto) * 100).toFixed(1) + '%' : '—';

    // Margen MO %
    const margen = b?.margen_mo_acumulado_pct ?? null;
    const margenStr = margen != null ? margen.toFixed(1) + '%' : '—';

    // Desvío MO = cuadrilla_acumulado - certificado_acumulado * 0.75
    const cuad = b?.cuadrilla_acumulado_pesos ?? null;
    let desvioStr = '—', devCls = 'cm';
    if (cuad != null && cert != null) {
      const d = cuad - cert * 0.75;
      desvioStr = fDesvio(d);
      devCls = d > 0 ? 'cr' : 'cv';
    }

    // Excedentes
    const exc = b?.excedentes_acumulado_pesos ?? null;
    const excStr = (exc && exc > 0) ? fPesos(exc) : '—';

    // Semanas cayendo (solo si AMARILLO y >= 2)
    const cayendo = b?.semanas_cayendo || 0;
    const cayendoHtml = (sem === 'AMARILLO' && cayendo >= 2)
      ? `<span class="cayendo-tag">↓ ${cayendo} sem cayendo</span>` : '';

    // Ícono en el círculo (solo para estados especiales)
    const circleIcon = sem === 'SIN_DATOS' ? '?' : sem === 'INCOHERENCIAS' ? '!' : '';

    return `
<div class="obra-card s-${sKey}">
  <div class="card-top">
    <div class="sem-circle sc-${sKey}">${circleIcon}</div>
    <div class="card-info">
      <div class="obra-nombre" title="${o.nombre}">${o.nombre}</div>
      <div class="obra-cliente">${o.cliente_razon_social || ''}</div>
      <div class="sem-tag">
        <span class="sem-label-text" style="color:${col}">${SEM_LABEL[sem] || sem}</span>
        ${cayendoHtml}
      </div>
    </div>
  </div>
  <div class="card-stats">
    <div class="stat">
      <div class="stat-l">Avance cert.</div>
      <div class="stat-v cm">${avance}</div>
    </div>
    <div class="stat">
      <div class="stat-l">Margen MO</div>
      <div class="stat-v ${margenCol(margen)}">${margenStr}</div>
    </div>
    <div class="stat">
      <div class="stat-l">Desvío MO</div>
      <div class="stat-v ${devCls}">${desvioStr}</div>
    </div>
    <div class="stat">
      <div class="stat-l">Excedentes</div>
      <div class="stat-v cm">${excStr}</div>
    </div>
  </div>
  <div class="card-foot">
    <div class="card-fecha">${b ? 'Semana al ' + fd(b.fecha) : 'Sin análisis aún'}</div>
  </div>
</div>`;
  }).join('');
}

// ── RENDER RESUMEN ────────────────────────────────────────────────
function renderResumen(obras, balMap, monthly) {
  const { label } = monthRange();
  document.getElementById('resTitle').textContent   = `Resumen · ${label}`;
  document.getElementById('resCert').textContent    = fPesos(monthly.cert || 0);
  document.getElementById('resExc').textContent     = fPesos(monthly.exc  || 0);

  // Contar por semáforo
  const counts = { VERDE:0, AMARILLO:0, ROJO:0, INCOHERENCIAS:0, SIN_DATOS:0 };
  for (const o of obras) counts[balMap[o.id]?.semaforo || 'SIN_DATOS']++;

  const pills = [
    { key:'ROJO',     dot:'#e74c3c', emoji:'🔴' },
    { key:'AMARILLO', dot:'#f39c12', emoji:'🟡' },
    { key:'VERDE',    dot:'#27ae60', emoji:'🟢' },
    { key:'SIN_DATOS',dot:'#4a5470', emoji:'⚪' },
  ];
  document.getElementById('semCounts').innerHTML = pills
    .map(p => `<div class="sem-count-pill">
      <div class="sc-dot" style="background:${p.dot}"></div>
      <span>${p.emoji} ${counts[p.key] || 0}</span>
    </div>`).join('');

  document.getElementById('resumenSection').style.display = 'block';
}

// ── INIT ──────────────────────────────────────────────────────────
window.onload = async () => {
  const { data: { session } } = await authClient.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: profile } = await authClient
    .from('user_profiles').select('full_name, role')
    .eq('id', session.user.id).single();
  if (!profile || !ALLOWED_ROLES.includes(profile.role)) {
    window.location.href = 'index.html'; return;
  }

  document.getElementById('portal-username').textContent = profile.full_name;
  document.getElementById('app-loading').style.display  = 'none';
  document.getElementById('mainContent').style.display  = 'block';
  await loadAll();
};
</script>
</body>
</html>
