<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nova Domus — Panel Gerencial</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo/nova-domus-isologo-monocromo-navy.svg" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Michroma&display=swap');

:root {
  --bg:         #0B132B;
  --surface:    #131b3d;
  --surface2:   #141E61;
  --border:     #2a3468;
  --text:       #FDFBF0;
  --muted:      #9a9cb8;
  --hint:       #4b5262;
  --accent:     #C8A96E;
  --accent-dim: #7a6340;
  --primary:    #141E61;
  --font-display: 'Michroma', sans-serif;
  --font-body:  'Inter', Arial, sans-serif;
  --ok:         #5fbf7d;
  --ok-bg:      rgba(95,191,125,.1);
  --warn:       #e0b85c;
  --warn-bg:    rgba(224,184,92,.1);
  --danger:     #e05c5c;
  --danger-bg:  rgba(224,92,92,.1);
  --radius:     10px;
  --radius-sm:  6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  min-height: 100vh;
}

/* ── LOADING OVERLAY ── */
#app-loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  font-size: 13px; color: var(--muted); letter-spacing: 0.02em;
}

/* ── PORTAL BAR ── */
.portal-bar {
  background: var(--bg);
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.portal-bar-left { display: flex; align-items: center; gap: 10px; }
.portal-back {
  display: flex; align-items: center; gap: 7px;
  text-decoration: none; color: var(--muted);
  font-size: 13px; transition: color 0.15s;
}
.portal-back:hover { color: var(--text); }
.portal-back-icon {
  height: 36px; width: auto;
  flex-shrink: 0;
}
.portal-divider { width: 1px; height: 14px; background: var(--border); }
.portal-module { font-size: 14px; font-weight: 600; color: var(--text); }
.portal-bar-right { display: flex; align-items: center; gap: 12px; }
#portal-username { font-size: 12px; color: var(--muted); }
.portal-logout {
  background: none; border: 1px solid var(--border); color: var(--muted);
  padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  transition: color 0.15s, border-color 0.15s; font-family: inherit;
}
.portal-logout:hover { color: var(--text); border-color: var(--muted); }

#app-content { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; } }

.page { padding: 1rem; max-width: 640px; margin: 0 auto; }

.page-title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-size: 22px; color: var(--text); margin-bottom: 14px; }

/* ── SELECTOR DE MES ── */
.mes-selector { display: flex; gap: 8px; margin-bottom: 10px; }
.mes-btn {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 6px; text-align: center;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.mes-btn.active { border-color: var(--accent-dim); background: rgba(200,169,110,.08); }
.mes-btn-label { font-size: 12.5px; font-weight: 600; color: var(--text); text-transform: capitalize; }
.mes-btn-tag { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 3px; }
.mes-btn.active .mes-btn-tag { color: var(--accent); }

.updated-line { font-size: 11.5px; color: var(--hint); margin-bottom: 18px; }

/* ── KPI GRID ── */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .15s; }
.kpi-card.open { grid-column: 1 / -1; border-color: var(--accent-dim); }
.kpi-hdr { padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.kpi-hdr-top { display: flex; justify-content: space-between; align-items: center; }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi-chevron { font-size: 10px; color: var(--muted); transition: transform .18s; flex-shrink: 0; }
.kpi-card.open .kpi-chevron { transform: rotate(180deg); }
.kpi-value { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.kpi-value.accent  { color: var(--accent); }
.kpi-value.ok      { color: var(--ok); }
.kpi-value.danger  { color: var(--danger); }
.kpi-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
.kpi-card.open .kpi-body { display: block; padding-top: 12px; }
.kpi-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 4px 0; color: var(--muted); }
.kpi-row span:last-child { color: var(--text); font-weight: 500; white-space: nowrap; }
.kpi-row.strong { font-weight: 600; padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--border); }
.kpi-row.strong span:last-child { font-weight: 700; }
.kpi-row .pos { color: var(--ok) !important; }
.kpi-row .neg { color: var(--danger) !important; }
.kpi-tag-proy { font-size: 9.5px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }

/* ── SEMÁFOROS ── */
.sem-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.sem-verde    { background: var(--ok); }
.sem-rojo     { background: var(--danger); }
.sem-amarillo { background: var(--warn); }
.sem-sin_datos, .sem-incoherencias, .sem-solo_costo { background: var(--hint); }

/* ── FILTRO / CONTADOR OBRAS ── */
.filter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.check-confiables { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.check-confiables input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.obras-count { font-size: 11.5px; color: var(--hint); }

/* ── LISTA DE OBRAS ── */
.obra-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; transition: border-color .15s; }
.obra-row.open { border-color: var(--accent-dim); }
.obra-row-hdr { padding: 12px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.obra-row-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.obra-row-dots { display: flex; gap: 4px; flex-shrink: 0; }
.obra-row-name { font-size: 13.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.obra-noconfiable-tag { font-size: 9.5px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 1px 6px; white-space: nowrap; flex-shrink: 0; }
.obra-row-chevron { font-size: 10px; color: var(--muted); transition: transform .18s; flex-shrink: 0; }
.obra-row.open .obra-row-chevron { transform: rotate(180deg); }
.obra-row-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
.obra-row.open .obra-row-body { display: block; padding-top: 12px; }

.confiable-toggle { border: none; cursor: pointer; font-family: inherit; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; }
.confiable-toggle.ok   { background: var(--ok-bg);   color: var(--ok);   border: 1px solid rgba(95,191,125,.35); }
.confiable-toggle.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(224,184,92,.35); }

/* ── STATES ── */
.loader {
  display: flex; align-items: center; justify-content: center;
  padding: 3rem; gap: 10px; color: var(--muted); font-size: 14px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 2rem 1rem; color: var(--hint); font-size: 13px; }

.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--primary); color: var(--text); padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: all .25s; pointer-events: none; z-index: 300; white-space: nowrap; }
.toast.ok  { background: var(--ok); color: #0B132B; }
.toast.err { background: var(--danger); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Loading overlay — shown until auth resolves -->
<div id="app-loading">Verificando acceso…</div>

<!-- Portal header — sticky, revealed after auth -->
<div id="app-header" style="display:none">
  <div class="portal-bar">
    <div class="portal-bar-left">
      <a href="../index.html" class="portal-back">
        <img src="../assets/logo/nova-domus-isologo-color-transparente.svg" alt="Nova Domus" class="portal-back-icon" />
        Portal
      </a>
      <div class="portal-divider"></div>
      <span class="portal-module">Panel Gerencial</span>

    <div class="portal-bar-right">
      <span id="portal-username"></span>

</div>

<!-- Content — revealed after auth -->
<div id="app-content" style="display:none">
  <div class="page">

    <div class="page-title">Panel Gerencial</div>

    <!-- NIVEL 0 — Selector de mes -->
    <div class="mes-selector" id="mesSelector"></div>
    <div class="updated-line" id="updatedLine">Actualizado —</div>

    <!-- NIVEL 1 — KPIs -->
    <div class="kpi-grid" id="kpiGrid">

      <div class="kpi-card" id="kpi-ingresos">
        <div class="kpi-hdr" onclick="toggleKpi('ingresos')">

        </div>
        <div class="kpi-body" id="kpiIngresosBody"></div>
      </div>

      <div class="kpi-card" id="kpi-fijos">
        <div class="kpi-hdr" onclick="toggleKpi('fijos')">
          <div class="kpi-hdr-top">
            <span class="kpi-label">Costos fijos</span>
            <span class="kpi-chevron">▼</span>
          </div>
          <div class="kpi-value" id="kpiFijosValue">—</div>
        </div>
        <div class="kpi-body" id="kpiFijosBody"></div>
      </div>

      <div class="kpi-card" id="kpi-variables">
        <div class="kpi-hdr" onclick="toggleKpi('variables')">
          <div class="kpi-hdr-top">
            <span class="kpi-label">Costos variables</span>
            <span class="kpi-chevron">▼</span>
          </div>
          <div class="kpi-value" id="kpiVariablesValue">—</div>
        </div>
        <div class="kpi-body" id="kpiVariablesBody"></div>
      </div>

      <div class="kpi-card" id="kpi-neto">
        <div class="kpi-hdr" onclick="toggleKpi('neto')">
          <div class="kpi-hdr-top">
            <span class="kpi-label">Resultado neto</span>
            <span class="kpi-chevron">▼</span>
          </div>
          <div class="kpi-value" id="kpiNetoValue">—</div>
        </div>
        <div class="kpi-body" id="kpiNetoBody"></div>
      </div>

    </div>

    <!-- NIVEL 2 — Obras -->
    <div class="filter-row">
      <label class="check-confiables">
        <input type="checkbox" id="chkConfiables" onchange="toggleSoloConfiables()">
        Solo confiables
      </label>
      <span class="obras-count" id="obrasCount">—</span>
    </div>

    <div id="obrasList"><div class="loader"><div class="spinner"></div>Cargando obras...</div></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../auth-bridge.js"></script>
<script>
// ── AUTH ──────────────────────────────────────────────────────
const AUTH_URL      = 'https://vvwnyszcfindtuvojqgs.supabase.co';
const AUTH_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d255c3pjZmluZHR1dm9qcWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NzQ0OTYsImV4cCI6MjA5NzA1MDQ5Nn0.m88xRQjifgPayIBY8Y98fP4jQ1AzyrBJidZDyTamWxE';
const ALLOWED_ROLES = ['admin', 'supervisor', 'contable'];

const { createClient } = supabase;
const authClient = createClient(AUTH_URL, AUTH_KEY);

async function handleLogout() {
  await authClient.auth.signOut();
  window.location.href = '../login.html';
}

// ── DATA (Cuadrilla/Obras project, via auth-bridge) ────────────
let cuadrillaToken = null;

async function sbObras(path) {
  const res = await fetch(CUADRILLA_URL + '/rest/v1/' + path, {
    headers: { apikey: CUADRILLA_PUBLISHABLE_KEY, Authorization: 'Bearer ' + cuadrillaToken }
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : [];
  if (!res.ok) throw new Error((data && data.message) || res.statusText);
  return data;
}

async function sbObrasPatch(path, body) {
  const res = await fetch(CUADRILLA_URL + '/rest/v1/' + path, {
    method: 'PATCH',
    headers: {
      apikey: CUADRILLA_PUBLISHABLE_KEY, Authorization: 'Bearer ' + cuadrillaToken,
      'Content-Type': 'application/json', Prefer: 'return=minimal',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
}

// ── DATA (Auth/Comercial project) — RLS exige el access_token real ──
async function sbAuth(path) {
  const { data: { session } } = await authClient.auth.getSession();
  const res = await fetch(AUTH_URL + '/rest/v1/' + path, {
    headers: { apikey: AUTH_KEY, Authorization: 'Bearer ' + (session?.access_token || AUTH_KEY) }
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : [];
  if (!res.ok) throw new Error((data && data.message) || res.statusText);
  return data;
}

// ── HELPERS ──────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }
function fmt(n) {
  const v = Math.round(n || 0);
  const abs = Math.abs(v).toLocaleString('es-AR');
  return (v < 0 ? '-$ ' : '$ ') + abs;
}
function fd(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

const SEM_LABEL = {
  VERDE: 'Verde', ROJO: 'Rojo', AMARILLO: 'Amarillo',
  SIN_DATOS: 'Sin datos', INCOHERENCIAS: 'Revisar datos', SOLO_COSTO: 'Solo costo',
};
const SEM_RANK = { ROJO: 0, INCOHERENCIAS: 1, AMARILLO: 2, SOLO_COSTO: 3, VERDE: 4, SIN_DATOS: 5 };
function semClass(s) { return 'sem-' + (s || 'sin_datos').toLowerCase(); }
function semLabel(s) { return SEM_LABEL[s] || 'Sin datos'; }
function semRank(s) { return SEM_RANK[s] ?? 5; }

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// ── NIVEL 0 — SELECTOR DE MES ──────────────────────────────────
let mesOffset = 0; // -1 anterior · 0 actual · +1 siguiente

function monthInfo(offset) {
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const year = base.getFullYear(), month = base.getMonth(); // month 0-indexed
  const start = `${year}-${pad(month + 1)}-01`;
  const endBase = new Date(year, month + 1, 1);
  const end = `${endBase.getFullYear()}-${pad(endBase.getMonth() + 1)}-01`;
  const periodoFiscal = `${year}-${pad(month + 1)}`;
  const tag = offset < 0 ? 'cerrado' : (offset === 0 ? 'vigente' : 'pronóstico');
  return { year, month, start, end, periodoFiscal, label: MESES[month], tag, incluyePlantilla: offset >= 0 };
}

function renderMesSelector() {
  const el = document.getElementById('mesSelector');
  el.innerHTML = [-1, 0, 1].map(off => {
    const mi = monthInfo(off);
    return `<div class="mes-btn ${off === mesOffset ? 'active' : ''}" onclick="setMes(${off})">
      <div class="mes-btn-label">${mi.label} ${mi.year}</div>
      <div class="mes-btn-tag">${mi.tag}</div>
    </div>`;
  }).join('');
}

function setMes(off) {
  if (off === mesOffset) return;
  mesOffset = off;
  renderMesSelector();
  loadKPIs();
}

async function loadUpdated() {
  const el = document.getElementById('updatedLine');
  try {
    const rows = await sbObras('analisis_obra?select=created_at&order=created_at.desc&limit=1');
    if (rows[0]?.created_at) {
      const d = new Date(rows[0].created_at);
      const fechaStr = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
      const horaStr = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      el.textContent = `Actualizado ${fechaStr} ${horaStr}`;
    } else {
      el.textContent = 'Actualizado — sin corridas registradas';
    }
  } catch (e) {
    el.textContent = 'Actualizado —';
    console.error('loadUpdated', e);
  }
}

// ── NIVEL 1 — KPIs ───────────────────────────────────────────
let openKpi = null;
let categoriasCache = null;

function toggleKpi(key) {
  openKpi = (openKpi === key) ? null : key;
  ['ingresos', 'fijos', 'variables', 'neto'].forEach(k => {
    document.getElementById('kpi-' + k).classList.toggle('open', k === openKpi);
  });
}

function groupCostosByCategoria(rows) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.nombre]) map[r.nombre] = { nombre: r.nombre, monto: 0, proyectado: false };
    map[r.nombre].monto += r.monto;
    if (r.proyectado) map[r.nombre].proyectado = true;
  });
  return Object.values(map).sort((a, b) => b.monto - a.monto);
}

async function loadKPIs() {
  const mi = monthInfo(mesOffset);
  ['kpiIngresosBody', 'kpiFijosBody', 'kpiVariablesBody', 'kpiNetoBody'].forEach(id => {
    document.getElementById(id).innerHTML = '<div class="loader" style="padding:1.2rem"><div class="spinner"></div>Cargando...</div>';
  });

  try {
    const [recibos, ventasAll, espontaneas, egresos, categorias, plantilla] = await Promise.all([
      sbObras(`recibos_cobros?select=monto_cobrado_mo_pesos,monto_cobrado_materiales_pesos&fecha_cobro=gte.${mi.start}&fecha_cobro=lt.${mi.end}`),
      sbAuth('ventas_comerciales?select=total_ars,fecha_pago,periodo_mes,periodo_anio'),
      sbObras(`obras?select=monto_cobrado_pesos&tipo_obra=eq.ESPONTANEA&cobrado=eq.true&fecha_cobro_real=gte.${mi.start}&fecha_cobro_real=lt.${mi.end}`),
      sbObras(`egresos_generales?select=categoria,monto_total,tipo_costo&periodo_fiscal=eq.${mi.periodoFiscal}`),
      categoriasCache || sbObras('categorias_egresos?select=codigo,nombre_display,tipo_costo'),
      mi.incluyePlantilla ? sbObras('plantilla_costos_fijos?select=categoria_codigo,monto_esperado&activo=eq.true') : Promise.resolve([]),
    ]);
    categoriasCache = categorias;

    // ── Ingresos ──
    const cobradoMO  = recibos.reduce((s, r) => s + (r.monto_cobrado_mo_pesos || 0), 0);
    const cobradoMat = recibos.reduce((s, r) => s + (r.monto_cobrado_materiales_pesos || 0), 0);
    const ventasMes = ventasAll.filter(v => {
      if (v.fecha_pago) return v.fecha_pago >= mi.start && v.fecha_pago < mi.end;
      return v.periodo_mes === mi.month + 1 && v.periodo_anio === mi.year;
    });
    const ventasTotal = ventasMes.reduce((s, v) => s + (v.total_ars || 0), 0);
    const espTotal = espontaneas.reduce((s, o) => s + (o.monto_cobrado_pesos || 0), 0);
    const ingresosTotal = cobradoMO + cobradoMat + ventasTotal + espTotal;

    // ── Costos fijos / variables ──
    const catMap = {};
    categorias.forEach(c => catMap[c.codigo] = c);
    const catCubiertas = new Set(egresos.map(e => e.categoria));

    const rows = egresos.map(e => ({
      nombre: catMap[e.categoria]?.nombre_display || e.categoria,
      tipo_costo: e.tipo_costo || catMap[e.categoria]?.tipo_costo,
      monto: e.monto_total || 0,
      proyectado: false,
    }));
    if (mi.incluyePlantilla) {
      plantilla.forEach(p => {
        if (catCubiertas.has(p.categoria_codigo)) return; // ya hay un real cargado ese periodo
        rows.push({
          nombre: catMap[p.categoria_codigo]?.nombre_display || p.categoria_codigo,
          tipo_costo: catMap[p.categoria_codigo]?.tipo_costo,
          monto: p.monto_esperado || 0,
          proyectado: true,
        });
      });
    }
    const fijosRows      = groupCostosByCategoria(rows.filter(r => r.tipo_costo === 'FIJO'));
    const variablesRows  = groupCostosByCategoria(rows.filter(r => r.tipo_costo === 'VARIABLE'));
    const totalFijos     = fijosRows.reduce((s, r) => s + r.monto, 0);
    const totalVariables = variablesRows.reduce((s, r) => s + r.monto, 0);
    const resultadoNeto   = ingresosTotal - totalFijos - totalVariables;

    renderKpis({
      cobradoMO, cobradoMat, ventasTotal, espTotal, ingresosTotal,
      fijosRows, totalFijos, variablesRows, totalVariables, resultadoNeto,
    });
  } catch (e) {
    ['kpiIngresosBody', 'kpiFijosBody', 'kpiVariablesBody', 'kpiNetoBody'].forEach(id => {
      document.getElementById(id).innerHTML = `<div class="empty-state">Error al cargar: ${esc(e.message)}</div>`;
    });
    console.error('loadKPIs', e);
  }
}

function costosRowsHtml(rows) {
  if (!rows.length) return '<div class="kpi-row"><span>Sin registros este mes</span><span></span></div>';
  return rows.map(r => `
    <div class="kpi-row">
      <span>${esc(r.nombre)}${r.proyectado ? '<span class="kpi-tag-proy">proyectado</span>' : ''}</span>
      <span>${fmt(r.monto)}</span>
    </div>`).join('');
}

function renderKpis(d) {
  // Ingresos
  document.getElementById('kpiIngresosValue').textContent = fmt(d.ingresosTotal);
  document.getElementById('kpiIngresosBody').innerHTML = `
    <div class="kpi-row"><span>Cobrado mano de obra</span><span>${fmt(d.cobradoMO)}</span></div>
    <div class="kpi-row"><span>Cobrado materiales</span><span>${fmt(d.cobradoMat)}</span></div>
    <div class="kpi-row"><span>Ventas comerciales</span><span>${fmt(d.ventasTotal)}</span></div>
    <div class="kpi-row"><span>Trabajos espontáneos cobrados</span><span>${fmt(d.espTotal)}</span></div>
    <div class="kpi-row strong"><span>Total ingresos</span><span>${fmt(d.ingresosTotal)}</span></div>`;

  // Costos fijos
  document.getElementById('kpiFijosValue').textContent = fmt(d.totalFijos);
  document.getElementById('kpiFijosBody').innerHTML = `
    ${costosRowsHtml(d.fijosRows)}
    <div class="kpi-row strong"><span>Total costos fijos</span><span>${fmt(d.totalFijos)}</span></div>`;

  // Costos variables
  document.getElementById('kpiVariablesValue').textContent = fmt(d.totalVariables);
  document.getElementById('kpiVariablesBody').innerHTML = `
    ${costosRowsHtml(d.variablesRows)}
    <div class="kpi-row strong"><span>Total costos variables</span><span>${fmt(d.totalVariables)}</span></div>`;

  // Resultado neto
  const netoEl = document.getElementById('kpiNetoValue');
  netoEl.textContent = fmt(d.resultadoNeto);
  netoEl.className = 'kpi-value ' + (d.resultadoNeto >= 0 ? 'ok' : 'danger');
  document.getElementById('kpiNetoBody').innerHTML = `
    <div class="kpi-row"><span>Ingresos</span><span>${fmt(d.ingresosTotal)}</span></div>
    <div class="kpi-row"><span>Costos fijos</span><span>${fmt(-d.totalFijos)}</span></div>
    <div class="kpi-row"><span>Costos variables</span><span>${fmt(-d.totalVariables)}</span></div>
    <div class="kpi-row strong"><span>Resultado neto</span><span class="${d.resultadoNeto >= 0 ? 'pos' : 'neg'}">${fmt(d.resultadoNeto)}</span></div>`;
}

// ── NIVEL 2 — OBRAS ────────────────────────────────────────────
let obrasData = [], analisisMap = {};
let soloConfiables = false, openObraId = null;

async function loadObras() {
  document.getElementById('obrasList').innerHTML = '<div class="loader"><div class="spinner"></div>Cargando obras...</div>';
  try {
    const [obras, analisis] = await Promise.all([
      sbObras('obras?select=id,nombre,datos_confiables&estado=eq.EN_CURSO&order=nombre'),
      sbObras('analisis_obra?select=obra_id,fecha,semaforo,semaforo_liquidez,certificado_acumulado_pesos,excedentes_acumulado_pesos,cuadrilla_acumulado_pesos&order=fecha.desc'),
    ]);

    obrasData = obras;

    analisisMap = {};
    analisis.forEach(a => {
      if (!analisisMap[a.obra_id] || a.fecha > analisisMap[a.obra_id].fecha) analisisMap[a.obra_id] = a;
    });

    renderObrasCount();
    renderObrasList();
  } catch (e) {
    document.getElementById('obrasList').innerHTML = `<div class="empty-state">Error al cargar obras: ${esc(e.message)}</div>`;
    console.error('loadObras', e);
  }
}

function renderObrasCount() {
  const total = obrasData.length;
  const sinClasificar = obrasData.filter(o => o.datos_confiables == null).length;
  document.getElementById('obrasCount').textContent =
    `${total} obra${total !== 1 ? 's' : ''} activa${total !== 1 ? 's' : ''} · ${sinClasificar} sin clasificar como confiables`;
}

function toggleSoloConfiables() {
  soloConfiables = document.getElementById('chkConfiables').checked;
  renderObrasList();
}

function renderObrasList() {
  const el = document.getElementById('obrasList');
  let list = obrasData;
  if (soloConfiables) list = list.filter(o => o.datos_confiables === true);

  if (!list.length) {
    el.innerHTML = '<div class="empty-state">No hay obras para mostrar.</div>';
    return;
  }

  const sorted = [...list].sort((a, b) => {
    const aa = analisisMap[a.id], bb = analisisMap[b.id];
    const ra = Math.min(semRank(aa?.semaforo), semRank(aa?.semaforo_liquidez));
    const rb = Math.min(semRank(bb?.semaforo), semRank(bb?.semaforo_liquidez));
    return ra - rb;
  });

  el.innerHTML = sorted.map(o => renderObraRow(o)).join('');
}

function renderObraRow(o) {
  const a = analisisMap[o.id];
  const isOpen = openObraId === o.id;
  const noConfiableTag = o.datos_confiables === false ? '<span class="obra-noconfiable-tag">⚠ No confiable</span>' : '';
  return `
    <div class="obra-row ${isOpen ? 'open' : ''}" id="obra-${o.id}">
      <div class="obra-row-hdr" onclick="toggleObra('${o.id}')">
        <div class="obra-row-left">
          <span class="obra-row-dots">
            <span class="sem-dot ${semClass(a?.semaforo)}" title="Rentabilidad: ${semLabel(a?.semaforo)}"></span>
            <span class="sem-dot ${semClass(a?.semaforo_liquidez)}" title="Liquidez: ${semLabel(a?.semaforo_liquidez)}"></span>
          </span>
          <span class="obra-row-name">${esc(o.nombre)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${noConfiableTag}
          <span class="obra-row-chevron">▼</span>
        </div>
      </div>
      <div class="obra-row-body">${isOpen ? renderObraDetail(o, a) : ''}</div>
    </div>`;
}

function toggleObra(id) {
  openObraId = (openObraId === id) ? null : id;
  renderObrasList();
}

function renderObraDetail(o, a) {
  if (!a) {
    return '<div class="empty-state" style="padding:12px 0">Sin datos de análisis todavía.</div>';
  }
  const confiable = o.datos_confiables !== false;
  return `
    <div class="kpi-row"><span><span class="sem-dot ${semClass(a.semaforo)}"></span> Rentabilidad</span><span>${semLabel(a.semaforo)}</span></div>
    <div class="kpi-row"><span><span class="sem-dot ${semClass(a.semaforo_liquidez)}"></span> Liquidez</span><span>${semLabel(a.semaforo_liquidez)}</span></div>
    <div class="kpi-row strong"><span>Certificado acumulado</span><span>${fmt(a.certificado_acumulado_pesos)}</span></div>
    <div class="kpi-row strong"><span>Excedentes acumulados</span><span>${fmt(a.excedentes_acumulado_pesos)}</span></div>
    <div class="kpi-row"><span>Cuadrilla real acumulada</span><span>${fmt(a.cuadrilla_acumulado_pesos)}</span></div>
    <div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="confiable-toggle ${confiable ? 'ok' : 'warn'}" onclick="event.stopPropagation();toggleConfiable('${o.id}', ${confiable})">
        ${confiable ? '✓ Confiable' : '⚠ No confiable'}
      </button>
      <span style="font-size:11px;color:var(--hint)">Click para marcar como ${confiable ? 'no confiable' : 'confiable'}</span>
    </div>`;
}

async function toggleConfiable(id, current) {
  try {
    await sbObrasPatch(`obras?id=eq.${id}`, { datos_confiables: !current });
    const o = obrasData.find(x => x.id === id);
    if (o) o.datos_confiables = !current;
    renderObrasCount();
    renderObrasList();
    toast('Guardado', 'ok');
  } catch (e) {
    toast('Error al guardar: ' + e.message, 'err');
  }
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await authClient.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }

  const { data: profile } = await authClient
    .from('user_profiles')
    .select('full_name, role')
    .eq('id', session.user.id)
    .single();

  if (!profile || !ALLOWED_ROLES.includes(profile.role)) {
    window.location.href = '../index.html';
    return;
  }

  cuadrillaToken = await getCuadrillaToken(authClient);

  document.getElementById('portal-username').textContent = profile.full_name;
  document.getElementById('app-loading').style.display = 'none';
  document.getElementById('app-header').style.display  = 'block';
  document.getElementById('app-content').style.display = 'block';

  renderMesSelector();
  await Promise.all([loadUpdated(), loadKPIs(), loadObras()]);
}

init();
</script>
