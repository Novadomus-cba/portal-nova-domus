<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Domus — Acceso</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/nova-domus-isologo-monocromo-navy.svg" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Michroma&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0B132B;
      --surface:   #131b3d;
      --border:    #2a3468;
      --text:      #FDFBF0;
      --muted:     #9a9cb8;
      --accent:    #C8A96E;
      --accent-dim:#7a6340;
      --primary:   #141E61;
      --error:     #e74c3c;
      --input-bg:  #131b3d;
      --font-display: 'Michroma', sans-serif;
      --font-body: 'Inter', Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,169,110,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,169,110,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px 40px;
      position: relative;
    }

    /* Gold top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 0 0 2px 2px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      height: 40px;
      width: auto;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      border-width: 1.5px;
    }

    input::placeholder {
      color: var(--muted);
    }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--primary);
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, border-color 0.15s;
      letter-spacing: 0.02em;
    }

    .btn:hover:not(:disabled) { opacity: 0.88; border-color: var(--accent); }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(231,76,60,0.1);
      border: 1px solid rgba(231,76,60,0.3);
      border-radius: 8px;
      font-size: 13px;
      color: var(--error);
      display: none;
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img class="logo-icon" src="assets/logo/nova-domus-isologo-color-transparente.svg" alt="Nova Domus" />
    <div>
      <div class="logo-text">Nova Domus</div>
      <div class="logo-sub">Portal de Gestión</div>
    </div>
  </div>

  <h1>Iniciar sesión</h1>
  <p class="subtitle">Acceso exclusivo para el equipo Nova Domus.</p>

  <div class="field">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" placeholder="usuario@nova-domus.com.ar" autocomplete="email" />
  </div>

  <div class="field">
    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
  </div>

  <button class="btn" id="loginBtn" onclick="handleLogin()">Ingresar</button>

  <div class="error-msg" id="errorMsg"></div>

  <div class="footer">Nova Domus · Córdoba, Argentina</div>
</div>

<script>
  const SUPABASE_URL = 'https://vvwnyszcfindtuvojqgs.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d255c3pjZmluZHR1dm9qcWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NzQ0OTYsImV4cCI6MjA5NzA1MDQ5Nn0.m88xRQjifgPayIBY8Y98fP4jQ1AzyrBJidZDyTamWxE';

  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ?next=<ruta> para volver adonde estaba el usuario tras el login (1B-3, 14/08/2026).
  // Solo se acepta una ruta relativa propia del portal — nunca una URL absoluta ni
  // "//host" — para no abrir un open redirect.
  function destinoTrasLogin() {
    const next = new URLSearchParams(window.location.search).get('next');
    if (next && next.startsWith('/') && !next.startsWith('//') && !next.includes('://')) {
      return next;
    }
    return 'index.html';
  }

  // Si ya hay sesión activa, redirigir directo
  (async () => {
    const { data: { session } } = await client.auth.getSession();
    if (session) window.location.href = destinoTrasLogin();
  })();

  // Login con Enter
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  async function handleLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const errMsg   = document.getElementById('errorMsg');

    errMsg.style.display = 'none';

    if (!email || !password) {
      showError('Completá el correo y la contraseña.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Ingresando…';

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      showError('Correo o contraseña incorrectos.');
      return;
    }

    window.location.href = destinoTrasLogin();
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
