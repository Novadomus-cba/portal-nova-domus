<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Domus — Facturas de Obras</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo/nova-domus-isologo-monocromo-navy.svg" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Michroma&display=swap');
:root {
  --bg: #0B132B; --surface: #131b3d; --surface2: #141E61;
  --border: #2a3468; --text: #FDFBF0; --muted: #9a9cb8;
  --accent: #C8A96E; --accent-dim: #7a6340;
  --primary: #141E61;
  --error: #e74c3c; --ok: #4ade80;
  --font-display: 'Michroma', sans-serif;
  --font-body: 'Inter', Arial, sans-serif;
  font-family: var(--font-body), system-ui, sans-serif; font-size: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

/* ── TOPBAR ── */
.topbar {
  background: rgba(11,19,43,.94); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); padding: 0 16px;
  height: 50px; display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; position: sticky; top: 0; z-index: 50;
}
.back-link { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 700; flex-shrink: 0; }
.back-link:hover { color: var(--text); }
.back-icon { width: 22px; height: 22px; background: linear-gradient(135deg,var(--accent-dim),var(--accent)); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
.topbar-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
.topbar-title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-size: 13px; font-weight: 800; color: var(--accent); flex-shrink: 0; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.user-name { font-size: 11px; color: var(--muted); }
.logout-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 3px 9px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; font-family: inherit; }
.logout-btn:hover { color: var(--text); border-color: var(--muted); }

/* ── LAYOUT ── */
.page { flex: 1; overflow-y: auto; padding: 16px; }
.container { max-width: 680px; margin: 0 auto; }

/* ── CARD ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card-title { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

/* ── FORM ── */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
.field-hint { font-size: 10px; color: var(--accent); margin-top: 4px; }
input, select, textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 9px 12px; color: var(--text);
  font-size: 13px; font-family: inherit; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--muted); }
select option { background: var(--surface2); }
textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.row { display: flex; gap: 10px; }
.row .field { flex: 1; min-width: 0; }
.ai-low-confidence { border-color: #f1c40f !important; box-shadow: 0 0 0 1px #f1c40f; }
.ai-hint { font-size: 10px; color: #f1c40f; margin-top: 4px; }

/* ── CARGA POR FOTO ── */
.imagen-preview-wrap { margin-top: 10px; }
.imagen-preview-wrap img { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--border); display: block; }
.pdf-preview-card { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.pdf-preview-icon { font-size: 28px; flex-shrink: 0; }
.pdf-preview-info { min-width: 0; }
.pdf-preview-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdf-preview-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
.imagen-status { margin-top: 8px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

/* ── TOGGLE ── */
.toggle-wrap { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.toggle-btn { flex: 1; padding: 9px 12px; font-size: 12px; font-weight: 700; border: none; background: var(--surface2); color: var(--muted); cursor: pointer; transition: all .15s; font-family: inherit; }
.toggle-btn.active { background: var(--primary); color: var(--text); border: 1px solid var(--accent); }

/* ── BUTTONS ── */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 10px 18px; border-radius: 6px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--text); border: 1px solid var(--accent); width: 100%; justify-content: center; margin-top: 4px; }
.btn-primary:hover { filter: brightness(1.2); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--muted); }
.btn-danger { background: #2e0d0d; border: 1px solid #4a1515; color: var(--error); }
.btn-sm { padding: 4px 10px; font-size: 10px; }

/* ── SECTION HEADER ── */
.section-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-title { font-size: 13px; font-weight: 800; }

/* ── FACTURA CARDS ── */
.fc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.fc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.fc-left { flex: 1; min-width: 0; }
.fc-proveedor { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.fc-right { text-align: right; flex-shrink: 0; }
.fc-monto { font-weight: 900; color: var(--accent); font-size: 14px; }
.fc-desc { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.fc-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
.badge { display: inline-flex; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge-empresa { background: #0d2035; color: #60a5fa; }
.badge-tecnico { background: #1e0d35; color: #a78bfa; }
.badge-vinculada { background: #0d2a1a; color: #4ade80; }
.badge-sinrecibo { background: #1e1e0d; color: #a3a36b; }

/* ── MODAL (bottom-sheet) ── */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; }
.modal-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-hdr h3 { font-size: 14px; font-weight: 800; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
.modal-ftr { display: flex; gap: 8px; margin-top: 16px; }
.modal-ftr .btn { flex: 1; justify-content: center; }
.modal-ftr .btn-primary { flex: 2; }

@media (min-width: 640px) {
  .topbar { padding: 0 24px; }
  .page { padding: 20px; }
  .modal-bg { align-items: center; }
  .modal { border-radius: 12px; }
}

/* ── MISC ── */
.empty { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 12px; }
#app-loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.spin { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sp .6s linear infinite; flex-shrink: 0; }
@keyframes sp { to { transform: rotate(360deg); } }
#toast { position: fixed; bottom: 18px; right: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 12px; transform: translateY(60px); opacity: 0; transition: all .2s; z-index: 9999; max-width: 300px; }
#toast.show { transform: translateY(0); opacity: 1; }
#toast.ok  { border-color: var(--ok);    color: var(--ok);    }
#toast.err { border-color: var(--error); color: var(--error); }
</style>
</head>
<body>

<div id="app-loading">Verificando acceso…</div>

<!-- TOPBAR -->
<div class="topbar">
  <img src="../assets/logo/nova-domus-isologo-color-transparente.svg" alt="Nova Domus" style="height:32px;width:auto;" />
  <a href="../index.html" class="back-link">
    <span class="back-icon">⌂</span>Portal
  </a>
  <div class="topbar-sep"></div>
  <span class="topbar-title">Facturas de Obras</span>
  <div class="topbar-right">
    <span class="user-name" id="userName"></span>
    <button class="logout-btn" onclick="handleLogout()">Salir</button>
  </div>
</div>

<!-- PAGE -->
<div class="page">
  <div class="container">

    <!-- CARGA POR FOTO -->
    <div class="card">
      <div class="card-title">Cargar desde foto (opcional)</div>
      <div class="field">
        <label>Foto o PDF del comprobante</label>
        <input type="file" id="fImagenInput" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" onchange="onImagenSelected(event)">
      </div>
      <div class="imagen-preview-wrap" id="imagenPreviewWrap" style="display:none">
        <img id="imagenPreview" alt="Vista previa del comprobante">
        <div class="pdf-preview-card" id="pdfPreviewCard" style="display:none">
          <span class="pdf-preview-icon">📄</span>
          <div class="pdf-preview-info">
            <div class="pdf-preview-name" id="pdfPreviewName"></div>
            <div class="pdf-preview-size" id="pdfPreviewSize"></div>
          </div>
        </div>
        <div class="imagen-status" id="imagenStatus"></div>
      </div>
    </div>

    <!-- FORM -->
    <div class="card">
      <div class="card-title">Cargar factura</div>

      <div class="field">
        <label>Obra *</label>
        <select id="fObra" onchange="onObraChange()">
          <option value="">— seleccionar obra —</option>
        </select>
      </div>

      <div class="field">
        <label>Proveedor *</label>
        <input type="text" id="fProveedor" list="dl-proveedores" placeholder="Nombre del proveedor" oninput="this.classList.remove('ai-low-confidence')">
        <datalist id="dl-proveedores">
          <option value="Dystech">
          <option value="Masnet">
          <option value="Seguridad Centro">
          <option value="Homiq">
        </datalist>
      </div>

      <div class="row">
        <div class="field">
          <label>Tipo de comprobante *</label>
          <select id="fTipo" onchange="this.classList.remove('ai-low-confidence')">
            <option value="Factura A">Factura A</option>
            <option value="Factura B">Factura B</option>
            <option value="Factura C">Factura C</option>
            <option value="Ticket">Ticket</option>
            <option value="Nota de Crédito">Nota de Crédito</option>
            <option value="Nota de Débito">Nota de Débito</option>
            <option value="Remito">Remito</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="field">
          <label>N° comprobante</label>
          <input type="text" id="fNumero" placeholder="0001-00012345" oninput="this.classList.remove('ai-low-confidence')">
        </div>
      </div>

      <div class="field">
        <label>Fecha de compra *</label>
        <input type="date" id="fFecha" oninput="this.classList.remove('ai-low-confidence')">
      </div>

      <div class="field">
        <label>Materiales / Descripción *</label>
        <textarea id="fMateriales" placeholder="Detallá qué se compró…" oninput="this.classList.remove('ai-low-confidence')"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label>Sin IVA $</label>
          <input type="number" id="fSinIva" step="0.01" min="0" placeholder="0.00" oninput="calcConIva(); this.classList.remove('ai-low-confidence')">
        </div>
        <div class="field" style="max-width:90px">
          <label>IVA</label>
          <input type="number" id="fIva" step="0.01" min="0" max="1" value="0.21" oninput="calcConIva(); this.classList.remove('ai-low-confidence')">

        <div class="field">

        <label>IVA (importe) — opcional</label>

      <div class="field">
        <label>¿Quién pagó?</label>
        <div class="toggle-wrap" style="margin-bottom:10px">
          <button class="toggle-btn active" id="btnEmpresa" onclick="setPago('empresa')">Empresa</button>

        </div>
        <div id="tecnicoWrap" style="display:none">
          <select id="fTecnico">
            <option value="">— seleccionar técnico —</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" id="btnSubmit" onclick="submitFactura()">
        Cargar factura

    </div>

    <!-- LIST -->

      <button class="modal-close" onclick="closeEdit()">✕</button>

      <label>Proveedor *</label>

      <div class="field">

          <option value="Factura B">Factura B</option>
          <option value="Factura C">Factura C</option>
          <option value="Ticket">Ticket</option>
          <option value="Nota de Crédito">Nota de Crédito</option>
          <option value="Nota de Débito">Nota de Débito</option>
          <option value="Remito">Remito</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="field">
        <label>N° comprobante</label>
        <input type="text" id="eNumero">
      </div>
    </div>
    <div class="field">
      <label>Fecha de compra *</label>
      <input type="date" id="eFecha">
    </div>
    <div class="field">
      <label>Materiales / Descripción *</label>
      <textarea id="eMateriales"></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label>Sin IVA $</label>
        <input type="number" id="eSinIva" step="0.01" oninput="calcConIvaE()">
      </div>
      <div class="field" style="max-width:90px">
        <label>IVA</label>
        <input type="number" id="eIva" step="0.01" oninput="calcConIvaE()">
      </div>
      <div class="field">
        <label>Con IVA $ *</label>
        <input type="number" id="eConIva" step="0.01">
      </div>
    </div>
    <div class="field">
      <label>IVA (importe) — opcional</label>

      </div>
      <div id="eTecnicoWrap" style="display:none">
        <select id="eTecnico">
          <option value="">— seleccionar técnico —</option>
        </select>
      </div>
    </div>

    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeEdit()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEdit()">Guardar cambios</button>
    </div>

</div>

<!-- CONFIRM MODAL (borrar / desvincular) -->
<div class="modal-bg" id="confirmModal" onclick="onConfirmBgClick(event)">
  <div class="modal">
    <div class="modal-hdr">
      <h3 id="confirmTitle">Confirmar</h3>
      <button class="modal-close" onclick="closeConfirm()">✕</button>

    <div id="confirmBody" style="font-size:12px;color:var(--muted);line-height:1.6"></div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirmBtn" style="flex:2;justify-content:center" onclick="runConfirm()">Confirmar</button>

  </div>
</div>

<!-- VINCULAR A RECIBO MODAL -->
<div class="modal-bg" id="vincularModal" onclick="onVincularBgClick(event)">
  <div class="modal">
    <div class="modal-hdr">
      <h3>Vincular a recibo</h3>
      <button class="modal-close" onclick="closeVincular()">✕</button>
    </div>
    <div class="field">
      <label>Recibo en borrador</label>
      <select id="vRecibo"></select>
    </div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeVincular()">Cancelar</button>
      <button class="btn btn-primary" id="vincularBtn" onclick="confirmVincular()">Vincular</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const AUTH_URL = 'https://vvwnyszcfindtuvojqgs.supabase.co';
const AUTH_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d255c3pjZmluZHR1dm9qcWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NzQ0OTYsImV4cCI6MjA5NzA1MDQ5Nn0.m88xRQjifgPayIBY8Y98fP4jQ1AzyrBJidZDyTamWxE';
// Obras se consolidó en este mismo proyecto (Comercial) el 14/08/2026: SB_URL/cuadrillaToken
// ya no son un proyecto ni un token distinto, son alias de la sesión de siempre.
const SB_URL   = AUTH_URL;
let cuadrillaToken = null;
const ALLOWED_ROLES = ['admin', 'supervisor', 'comercial'];
const ANALYZE_IMAGE_URL = AUTH_URL + '/functions/v1/analyze-image';
const ALLOWED_FILE_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'application/pdf'];
const MAX_FILE_SIZE_BYTES = 10 * 1024 * 1024;

const TIPO_COMPROBANTE_IA_A_LABEL = {
  FACTURA_A:    'Factura A',
  FACTURA_B:    'Factura B',
  FACTURA_C:    'Factura C',
  TICKET:       'Ticket',
  NOTA_CREDITO: 'Nota de Crédito',
  NOTA_DEBITO:  'Nota de Débito',
};

const { createClient } = supabase;
const authClient = createClient(AUTH_URL, AUTH_KEY);

// ── STATE ─────────────────────────────────────────────────────
let currentUser  = null;
let selectedObra = null;
let tecnicos     = [];
let facturas     = [];
let editingId    = null;
let origenPago   = 'empresa';
let origenPagoE  = 'empresa';
let confirmCtx      = null; // { type: 'delete'|'desvincular', id }
let vincularFacturaId = null;

// ── FETCH ─────────────────────────────────────────────────────
async function apiFetch(baseUrl, apiKey, method, table, body = null, query = '', schema = '') {
  const isCuadrilla = baseUrl === SB_URL;
  const headers = {
    'apikey': isCuadrilla ? AUTH_KEY : apiKey,
    'Authorization': `Bearer ${isCuadrilla ? cuadrillaToken : apiKey}`,
    'Content-Type': 'application/json',
    'Prefer': method === 'POST' ? 'return=representation' : method === 'PATCH' ? 'return=minimal' : ''
  };
  if (schema) { headers['Accept-Profile'] = schema; headers['Content-Profile'] = schema; }
  const res = await fetch(`${baseUrl}/rest/v1/${table}${query}`, {
    method, headers,
    ...(body ? { body: JSON.stringify(body) } : {})
  });
  if (!res.ok) {
    const text = await res.text();
    let msg = res.statusText;
    try { msg = JSON.parse(text).message || msg; } catch {}
    throw new Error(msg);
  }
  if (method === 'DELETE' || res.status === 204) return true;
  const text = await res.text();
  return JSON.parse(text);
}

const sbGet       = (t, q='') => apiFetch(SB_URL,   null,     'GET',    t, null, q);

async function loadObras() {
  try {

      (formales.length ? `<optgroup label="— Obras —">${formales.map(opt).join('')}</optgroup>` : '') +
      (espontaneas.length ? `<optgroup label="— Trabajos Espontáneos —">${espontaneas.map(opt).join('')}</optgroup>` : '');

async function loadTecnicos() {

    tecnicos = rows;
    const opts = tecnicos.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');

async function loadFacturas() {
  const q = selectedObra
    ? `?select=*,obras(nombre)&obra_id=eq.${selectedObra.id}&order=created_at.desc&limit=30`
    : `?select=*,obras(nombre)&order=created_at.desc&limit=30`;
  try {
    const rows = await sbGet('facturas_obra', q);
    const ids  = rows.map(r => r.id);
    // El estado de vinculación (VINCULADA/PENDIENTE/SIN_RECIBO_BORRADOR) sale de
    // v_facturas_estado_recibo, no se reimplementa la lógica acá.
    const estados = ids.length
      ? await sbGet('v_facturas_estado_recibo',
          `?factura_id=in.(${ids.join(',')})&select=factura_id,recibo_id,recibo_numero,recibo_estado,estado_vinculacion`)
      : [];
    const estadoMap = new Map(estados.map(e => [e.factura_id, e]));
    facturas = rows.map(f => ({ ...f, ...(estadoMap.get(f.id) || {}) }));
    renderList();
  } catch (e) {
    document.getElementById('facturasList').innerHTML =
      `<div class="empty">Error al cargar facturas: ${e.message}</div>`;
  }
}

// ── IVA (tasa 0-1, no importe) ───────────────────────────────
function ivaValueOrDefault(rawValue) {
  // parseFloat(rawValue) || 0.21 trataría un 0 explícito como "sin valor" (0 es falsy en JS)
  // y lo pisaría con el default — acá se respeta un 0 explícito (comprobante sin IVA).
  const trimmed = String(rawValue ?? '').trim();
  if (trimmed === '') return 0.21;
  const parsed = parseFloat(trimmed);
  return isNaN(parsed) ? 0.21 : parsed;
}

// ── IVA (importe, opcional — nunca se calcula ni se prellena con conIva-sinIva) ──
function optionalAmount(rawValue) {
  const trimmed = String(rawValue ?? '').trim();
  if (trimmed === '') return null;
  const parsed = parseFloat(trimmed);
  return isNaN(parsed) ? null : parsed;
}

// ── CARGA POR FOTO (IA) ───────────────────────────────────────
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function clearAiConfidenceFlags() {
  ['fProveedor', 'fTipo', 'fNumero', 'fFecha', 'fMateriales', 'fSinIva', 'fIva', 'fConIva', 'fIvaImporte']
    .forEach(id => document.getElementById(id).classList.remove('ai-low-confidence'));
}

function flagIfLowConfidence(fieldId, confianza) {
  if (confianza === 'baja') {
    document.getElementById(fieldId).classList.add('ai-low-confidence');
  }
}

async function onImagenSelected(event) {
  const file = event.target.files[0];
  const previewWrap = document.getElementById('imagenPreviewWrap');
  const previewImg  = document.getElementById('imagenPreview');
  const pdfCard      = document.getElementById('pdfPreviewCard');
  const statusEl    = document.getElementById('imagenStatus');

  // limpiar estado de una selección anterior antes de procesar la nueva
  previewImg.style.display = 'none';
  previewImg.src = '';
  pdfCard.style.display = 'none';
  statusEl.textContent = '';

  if (!file) { previewWrap.style.display = 'none'; return; }

  if (!ALLOWED_FILE_TYPES.includes(file.type)) {
    statusEl.textContent = 'Formato no soportado. Subí una imagen (JPG, PNG, WEBP) o un PDF.';
    toast('Formato no soportado. Subí una imagen (JPG, PNG, WEBP) o un PDF.', 'err');
    event.target.value = '';
    previewWrap.style.display = 'none';
    return;
  }
  if (file.size > MAX_FILE_SIZE_BYTES) {
    statusEl.textContent = 'El archivo supera los 10 MB. Reducilo o sacá una foto más liviana.';
    toast('El archivo supera los 10 MB. Reducilo o sacá una foto más liviana.', 'err');
    event.target.value = '';
    previewWrap.style.display = 'none';
    return;
  }

  clearAiConfidenceFlags();
  previewWrap.style.display = 'block';

  if (file.type === 'application/pdf') {
    document.getElementById('pdfPreviewName').textContent = file.name;
    document.getElementById('pdfPreviewSize').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
    pdfCard.style.display = 'flex';
  } else {
    previewImg.src = URL.createObjectURL(file);
    previewImg.style.display = 'block';
  }

  statusEl.innerHTML = '<div class="spin"></div> Analizando con IA…';

  try {
    const { data: { session } } = await authClient.auth.getSession();
    if (!session) {
      statusEl.textContent = 'Sesión inválida, recargá la página.';
      return;
    }

    const imageBase64 = await fileToBase64(file);

    const res = await fetch(ANALYZE_IMAGE_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({
        analysis_type: 'factura',
        image_base64: imageBase64,
        mime_type: file.type || 'image/jpeg',
      }),
    });

    const rawText = await res.text();
    let data;
    try { data = JSON.parse(rawText); } catch { data = null; }

    if (!res.ok || !data) {
      const errMsg = (data && data.error) || rawText || res.statusText;
      statusEl.textContent = 'No se pudo analizar: ' + errMsg;
      toast('No se pudo analizar la imagen', 'err');
      return;
    }

    applyAiResult(data.result);
    statusEl.textContent = '✅ Listo — revisá los campos marcados en amarillo antes de guardar.';
  } catch (e) {
    statusEl.textContent = 'Error al analizar la imagen.';
    toast('Error al analizar la imagen: ' + e.message, 'err');
  }
}

function applyAiResult(result) {
  if (!result) return;
  const proveedor  = result.proveedor || {};
  const tipo       = result.tipo_comprobante || {};
  const numero     = result.numero_comprobante || {};
  const fecha      = result.fecha_compra || {};
  const materiales = result.materiales || {};
  const sinIva     = result.monto_sin_iva || {};
  const iva        = result.iva || {};
  const conIva     = result.monto_con_iva || {};

  if (proveedor.valor) document.getElementById('fProveedor').value = proveedor.valor;
  flagIfLowConfidence('fProveedor', proveedor.confianza);

  const tipoLabel = TIPO_COMPROBANTE_IA_A_LABEL[tipo.valor];
  if (tipoLabel) document.getElementById('fTipo').value = tipoLabel;
  flagIfLowConfidence('fTipo', tipo.confianza);

  if (numero.valor) document.getElementById('fNumero').value = numero.valor;
  flagIfLowConfidence('fNumero', numero.confianza);

  if (fecha.valor) document.getElementById('fFecha').value = fecha.valor;
  flagIfLowConfidence('fFecha', fecha.confianza);

  if (materiales.valor) document.getElementById('fMateriales').value = materiales.valor;
  flagIfLowConfidence('fMateriales', materiales.confianza);

  const sinIvaNum = Number(sinIva.valor);
  const sinIvaOk  = sinIva.valor != null && !isNaN(sinIvaNum);
  if (sinIvaOk) document.getElementById('fSinIva').value = sinIvaNum.toFixed(2);
  flagIfLowConfidence('fSinIva', sinIva.confianza);

  // El importe de IVA viene tal como figura impreso (nunca calculado). El campo del
  // formulario es una TASA (0-1) para autocompletar el total, así que acá se deriva
  // la tasa a partir del importe real — es un mapeo de UI, no una re-inferencia del
  // dato que ya extrajo la IA. Si no hay IVA discriminado (no_aplica / no legible),
  // la tasa queda en 0, tal como pidió Agustín.
  const ivaNum = Number(iva.valor);
  const ivaOk  = iva.valor != null && !isNaN(ivaNum);
  if (!ivaOk) {
    document.getElementById('fIva').value = '0';
  } else if (sinIvaOk && sinIvaNum > 0) {
    document.getElementById('fIva').value = (ivaNum / sinIvaNum).toFixed(4);
  }
  flagIfLowConfidence('fIva', iva.confianza); // "no_aplica" no marca advertencia: es esperado, no una duda

  // iva_importe: el monto de IVA tal como lo extrajo la IA del comprobante, sin
  // derivarlo de nada — es el mismo dato que arriba se usa para la tasa, pero acá
  // va directo al campo de importe real (editable).
  if (ivaOk) document.getElementById('fIvaImporte').value = ivaNum.toFixed(2);
  flagIfLowConfidence('fIvaImporte', iva.confianza);

  const conIvaNum = Number(conIva.valor);
  if (conIva.valor != null && !isNaN(conIvaNum)) {
    document.getElementById('fConIva').value = conIvaNum.toFixed(2);
  } else {
    calcConIva();
  }
  flagIfLowConfidence('fConIva', conIva.confianza);
}

async function submitFactura() {
  const btn = document.getElementById('btnSubmit');
  if (btn.disabled) return;

  const obraId     = document.getElementById('fObra').value;
  const proveedor  = document.getElementById('fProveedor').value.trim();
  const materiales = document.getElementById('fMateriales').value.trim();
  const fecha      = document.getElementById('fFecha').value;
  const conIva     = parseFloat(document.getElementById('fConIva').value);
  const tecnicoId  = origenPago === 'tecnico'
    ? (document.getElementById('fTecnico').value || null) : null;

  if (!obraId)             { toast('Seleccioná una obra', 'err'); return; }
  if (!proveedor)          { toast('Ingresá el proveedor', 'err'); return; }
  if (!fecha)              { toast('Ingresá la fecha', 'err'); return; }
  if (!materiales)         { toast('Describí los materiales', 'err'); return; }
  if (!conIva || conIva <= 0) { toast('Ingresá el monto con IVA', 'err'); return; }
  if (origenPago === 'tecnico' && !tecnicoId) { toast('Seleccioná el técnico', 'err'); return; }

  // Deshabilitar ANTES del primer await: si no, dos clicks separados por ~300ms
  // pasan ambos la validación (sync) y entran a getSemanaId antes de que este
  // botón se deshabilite, generando dos inserciones.
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Cargando…';
  try {
    const semanaId = await getSemanaId(fecha).catch(() => null);

    const payload = {
      obra_id:            obraId,
      proveedor,
      tipo_comprobante:   document.getElementById('fTipo').value,
      numero_comprobante: document.getElementById('fNumero').value.trim() || null,
      fecha_compra:       fecha,
      materiales,
      monto_sin_iva:      parseFloat(document.getElementById('fSinIva').value) || 0,
      iva:                ivaValueOrDefault(document.getElementById('fIva').value),
      iva_importe:        optionalAmount(document.getElementById('fIvaImporte').value),
      monto_con_iva:      conIva,
      origen_pago:        origenPago,
      tecnico_id:         tecnicoId,
      semana_id:          semanaId,
      cargado_por:        currentUser.id,
    };

    await sbPost('facturas_obra', payload);
    toast('✅ Factura cargada', 'ok');
    resetForm();
    await loadFacturas();
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Cargar factura';
  }
}

function getWeekBounds(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); // 0=Sun … 5=Fri … 6=Sat
  const daysBack = (dow - 5 + 7) % 7;
  const desde = new Date(d); desde.setDate(d.getDate() - daysBack);
  const hasta = new Date(desde); hasta.setDate(desde.getDate() + 6);
  return {
    desde: desde.toISOString().slice(0, 10),
    hasta: hasta.toISOString().slice(0, 10)
  };
}

async function getSemanaId(fechaCompra) {
  const rows = await cuadrillGet('semanas_liquidacion',
    `?fecha_desde=lte.${fechaCompra}&fecha_hasta=gte.${fechaCompra}&limit=1`);
  if (rows.length) return rows[0].id;
  const { desde, hasta } = getWeekBounds(fechaCompra);
  const created = await cuadrillPost('semanas_liquidacion', { fecha_desde: desde, fecha_hasta: hasta });
  return created[0].id;
}

// ── LIST ──────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('facturasList');
  if (!facturas.length) {
    el.innerHTML = '<div class="empty">No hay facturas cargadas todavía.</div>';
    return;
  }
  const isAdmin = currentUser?.role === 'admin';
  el.innerHTML = facturas.map(f => {
    const tecnico    = f.tecnico_id ? tecnicos.find(t => t.id === f.tecnico_id) : null;
    const pagoLabel  = f.origen_pago === 'tecnico'
      ? `<span class="badge badge-tecnico">Técnico${tecnico ? ': ' + tecnico.nombre : ''}</span>`
      : '<span class="badge badge-empresa">Empresa</span>';
    const obraBadge  = !selectedObra && f.obras?.nombre
      ? `<span>${f.obras.nombre}</span>` : '';
    // Borrar: quien cargó la factura, o un admin (RLS lo exige del lado de la base).
    // Vincular/Desvincular: requiere lectura de recibos en RLS, que hoy solo tienen
    // admin y supervisor — comercial no, aunque haya cargado la factura.
    const canDelete = isAdmin || f.cargado_por === currentUser?.id;
    const canLinkRecibos = isAdmin || currentUser?.role === 'supervisor';

    let vinculoBadge = '';
    let vinculoBtn = '';
    if (f.estado_vinculacion === 'VINCULADA') {
      vinculoBadge = `<span class="badge badge-vinculada">Recibo N°${f.recibo_numero ?? '—'}</span>`;
      if (canLinkRecibos) vinculoBtn = `<button class="btn btn-ghost btn-sm" onclick="askDesvincular(${f.id})">Desvincular</button>`;
    } else if (f.estado_vinculacion === 'PENDIENTE') {
      if (canLinkRecibos) vinculoBtn = `<button class="btn btn-ghost btn-sm" onclick="openVincular(${f.id})">Vincular a recibo</button>`;
    } else if (f.estado_vinculacion === 'SIN_RECIBO_BORRADOR') {
      vinculoBadge = '<span class="badge badge-sinrecibo">Sin recibo en borrador</span>';
    }

    const editBtn = isAdmin
      ? `<button class="btn btn-ghost btn-sm" onclick="openEdit(${f.id})">✏ Editar</button>` : '';
    const deleteBtn = (canDelete && f.estado_vinculacion !== 'VINCULADA')
      ? `<button class="btn btn-danger btn-sm" onclick="askDelete(${f.id})">🗑 Eliminar</button>` : '';
    const actions = (editBtn || vinculoBtn || deleteBtn)
      ? `<div class="fc-actions">${editBtn}${vinculoBtn}${deleteBtn}</div>` : '';

    return `<div class="fc" id="fc-${f.id}">
      <div class="fc-top">
        <div class="fc-left">
          <div class="fc-proveedor">${f.proveedor}</div>
          <div class="fc-meta">
            <span>${fd(f.fecha_compra)}</span>
            <span>${f.tipo_comprobante}${f.numero_comprobante ? ' ' + f.numero_comprobante : ''}</span>
            ${obraBadge}
          </div>
        </div>
        <div class="fc-right">
          <div class="fc-monto">${f$(f.monto_con_iva)}</div>
          <div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${pagoLabel}${vinculoBadge}</div>
        </div>
      </div>
      ${f.materiales ? `<div class="fc-desc">${f.materiales}</div>` : ''}
      ${actions}
    </div>`;
  }).join('');
}

// ── CONFIRM (borrar / desvincular) ───────────────────────────
function askDelete(id) {
  const f = facturas.find(x => x.id === id);
  if (!f) return;
  confirmCtx = { type: 'delete', id };
  document.getElementById('confirmTitle').textContent = 'Eliminar factura';
  document.getElementById('confirmBody').innerHTML =
    `¿Eliminar la factura de <b>${f.proveedor}</b>` +
    `${f.numero_comprobante ? ' N° ' + f.numero_comprobante : ''}` +
    ` por <b>${f$(f.monto_con_iva)}</b>? Esta acción no se puede deshacer.`;
  document.getElementById('confirmBtn').textContent = 'Sí, eliminar';
  document.getElementById('confirmModal').classList.add('open');
}

function askDesvincular(id) {
  const f = facturas.find(x => x.id === id);
  if (!f) return;
  confirmCtx = { type: 'desvincular', id };
  document.getElementById('confirmTitle').textContent = 'Desvincular factura';
  document.getElementById('confirmBody').innerHTML =
    `¿Desvincular la factura de <b>${f.proveedor}</b> del recibo N°${f.recibo_numero ?? '—'}? ` +
    `Va a quedar pendiente para vincularse a otro recibo.`;
  document.getElementById('confirmBtn').textContent = 'Sí, desvincular';
  document.getElementById('confirmModal').classList.add('open');
}

function closeConfirm() {
  confirmCtx = null;
  document.getElementById('confirmModal').classList.remove('open');
}

function onConfirmBgClick(e) {
  if (e.target === document.getElementById('confirmModal')) closeConfirm();
}

async function runConfirm() {
  if (!confirmCtx) return;
  const { type, id } = confirmCtx;
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  try {
    if (type === 'delete') {
      await sbDel('facturas_obra', `?id=eq.${id}`);
      toast('Factura eliminada', 'ok');
    } else if (type === 'desvincular') {
      await sbRpc('desvincular_factura', { p_factura_id: id });
      toast('Factura desvinculada', 'ok');
    }
    closeConfirm();
    await loadFacturas();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ── VINCULAR A RECIBO ────────────────────────────────────────
async function openVincular(id) {
  const f = facturas.find(x => x.id === id);
  if (!f) return;
  vincularFacturaId = id;
  const sel = document.getElementById('vRecibo');
  sel.innerHTML = '<option value="">Cargando…</option>';
  document.getElementById('vincularModal').classList.add('open');
  try {
    const recibos = await sbGet('recibos',
      `?obra_id=eq.${f.obra_id}&estado=eq.BORRADOR&select=id,numero,fecha_emision&order=fecha_emision.desc`);
    sel.innerHTML = recibos.length
      ? '<option value="">— seleccionar recibo —</option>' +
        recibos.map(r => `<option value="${r.id}">Recibo N°${r.numero} — ${fd(r.fecha_emision)}</option>`).join('')
      : '<option value="">No hay recibos en borrador para esta obra</option>';
  } catch (e) {
    sel.innerHTML = '<option value="">Error al cargar recibos</option>';
    toast(e.message, 'err');
  }
}

function closeVincular() {
  vincularFacturaId = null;
  document.getElementById('vincularModal').classList.remove('open');
}

function onVincularBgClick(e) {
  if (e.target === document.getElementById('vincularModal')) closeVincular();
}

async function confirmVincular() {
  const recId = document.getElementById('vRecibo').value;
  if (!recId) { toast('Seleccioná un recibo', 'err'); return; }
  const btn = document.getElementById('vincularBtn');
  btn.disabled = true;
  try {
    await sbRpc('vincular_factura_a_recibo', { p_factura_id: vincularFacturaId, p_recibo_id: recId });
    toast('Factura vinculada', 'ok');
    closeVincular();
    await loadFacturas();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ── EDIT MODAL ────────────────────────────────────────────────
function openEdit(id) {
  const f = facturas.find(x => x.id === id);
  if (!f) return;
  editingId = id;
  document.getElementById('eProveedor').value  = f.proveedor || '';
  document.getElementById('eTipo').value        = f.tipo_comprobante || 'Factura A';
  document.getElementById('eNumero').value      = f.numero_comprobante || '';
  document.getElementById('eFecha').value       = f.fecha_compra || '';
  document.getElementById('eMateriales').value  = f.materiales || '';
  document.getElementById('eSinIva').value      = f.monto_sin_iva ?? '';
  document.getElementById('eIva').value         = f.iva ?? 0.21;
  document.getElementById('eConIva').value      = f.monto_con_iva ?? '';
  document.getElementById('eIvaImporte').value  = f.iva_importe ?? '';
  setPagoE(f.origen_pago || 'empresa');
  if (f.tecnico_id) document.getElementById('eTecnico').value = f.tecnico_id;
  document.getElementById('editModal').classList.add('open');
}

function closeEdit() {
  editingId = null;
  document.getElementById('editModal').classList.remove('open');
}

function onModalBgClick(e) {
  if (e.target === document.getElementById('editModal')) closeEdit();
}

async function saveEdit() {
  if (!editingId) return;
  const proveedor  = document.getElementById('eProveedor').value.trim();
  const materiales = document.getElementById('eMateriales').value.trim();
  const fecha      = document.getElementById('eFecha').value;
  const conIva     = parseFloat(document.getElementById('eConIva').value);
  const tecnicoId  = origenPagoE === 'tecnico'
    ? (document.getElementById('eTecnico').value || null) : null;

  if (!proveedor || !materiales || !fecha || !conIva) {
    toast('Completá los campos requeridos', 'err'); return;
  }

  const payload = {
    proveedor,
    tipo_comprobante:   document.getElementById('eTipo').value,
    numero_comprobante: document.getElementById('eNumero').value.trim() || null,
    fecha_compra:       fecha,
    materiales,
    monto_sin_iva:      parseFloat(document.getElementById('eSinIva').value) || 0,
    iva:                ivaValueOrDefault(document.getElementById('eIva').value),
    iva_importe:        optionalAmount(document.getElementById('eIvaImporte').value),
    monto_con_iva:      conIva,
    origen_pago:        origenPagoE,
    tecnico_id:         tecnicoId,
  };

  try {
    await sbPatch('facturas_obra', payload, `?id=eq.${editingId}`);
    toast('Factura actualizada', 'ok');
    closeEdit();
    await loadFacturas();
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  }
}

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `show ${type}`;
  setTimeout(() => t.className = '', 3500);
}
</script>
